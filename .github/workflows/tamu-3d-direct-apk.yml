name: TAMU 3D direct Android APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/tamu-3d-stock-stack-20261113]
    paths:
      - .github/workflows/tamu-3d-direct-apk.yml
      - scripts/tamu_3d_*
      - scenes/tamu_3d_*
permissions:
  contents: read
concurrency:
  group: tamu-3d-direct-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify pinned 3D libraries
        run: |
          set -euo pipefail
          python3 scripts/tamu_3d_vendor.py install
          python3 scripts/tamu_3d_vendor.py verify
          test -s addons/terrain_3d/bin/libterrain.android.debug.arm64.so
      - name: Install Godot 4.6 and Android export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
          godot --headless --version
      - name: Configure isolated 3D app and Android signing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.godot')
          t=p.read_text()
          assert 'run/main_scene="res://scenes/main.tscn"' in t
          t=t.replace('run/main_scene="res://scenes/main.tscn"', 'run/main_scene="res://scenes/tamu_3d_pilot.tscn"')
          t=t.replace('config/name="oyun"', 'config/name="TAMU 3D Prototype"')
          t+='\n[physics]\n3d/physics_engine="Jolt Physics"\n'
          p.write_text(t)
          p=Path('export_presets.cfg')
          t=p.read_text()
          assert 'export_filter="resources"' in t
          t=t.replace('export_filter="resources"', 'export_filter="all_resources"', 1)
          t=t.replace(',*.glb,*.fbx', ',*.fbx')
          t=t.replace('package/unique_name="org.osman.tamu.godotbenchmark"', 'package/unique_name="org.osman.tamu.preview3d"')
          t=t.replace('package/name="TAMU Godot Benchmark"', 'package/name="TAMU 3D Prototype"')
          p.write_text(t)
          print('TAMU3D_ANDROID_CONFIG_OK')
          PY
          SDK="$ANDROID_HOME"
          test -d "$SDK"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.6.tres"
          keytool -genkeypair -keystore /tmp/tamu3d-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -storepass android -keypass android -dname 'CN=TAMU 3D,O=OSMAN,C=TR'
          cat >> export_presets.cfg <<'EOF'
          keystore/debug="/tmp/tamu3d-debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF
      - name: Import and verify 3D prototype
        run: |
          set -euo pipefail
          timeout --kill-after=5s 240s godot --headless --path . --editor --import --quit 2>&1 | tee tamu3d-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*Failed loading GDExtension' tamu3d-import.log; then exit 1; fi
          timeout --kill-after=5s 120s godot --headless --path . --script res://scripts/tamu_3d_smoke.gd 2>&1 | tee tamu3d-native.log
          grep -q TAMU3D_NATIVE_BOOT_OK tamu3d-native.log
      - name: Export Android APK with Terrain3D ARM64 native library
        run: |
          set -euo pipefail
          mkdir -p dist
          timeout --kill-after=5s 400s godot --headless --path . --export-debug Android dist/TAMU_3D_Prototype-debug.apk 2>&1 | tee tamu3d-export.log
          test -s dist/TAMU_3D_Prototype-debug.apk
          unzip -t dist/TAMU_3D_Prototype-debug.apk | tail -1
          unzip -l dist/TAMU_3D_Prototype-debug.apk > tamu3d-apk-contents.log
          grep -q 'lib/arm64-v8a/libterrain.android.debug.arm64.so' tamu3d-apk-contents.log
          grep -q 'lib/arm64-v8a/libgodot_android.so' tamu3d-apk-contents.log
          sha256sum dist/TAMU_3D_Prototype-debug.apk > dist/SHA256SUMS
          echo TAMU3D_ANDROID_APK_PACKAGED_OK
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TAMU-3D-Prototype-Android-APK
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/TAMU_3D_Prototype-debug.apk
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TAMU-3D-Android-Build-Evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            tamu3d-import.log
            tamu3d-native.log
            tamu3d-export.log
            tamu3d-apk-contents.log
