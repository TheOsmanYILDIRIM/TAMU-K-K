name: TAMU needle-tools SF3D ONNX CPU tree trial
on:
  push:
    branches: [experiment/tamu-3d-stock-stack-20261113]
    paths: [.github/workflows/sf3d-tree-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ONNX CPU runtime and mesh libraries
        run: |
          python -m pip install 'numpy<2.1' pillow onnxruntime huggingface_hub hf_xet trimesh scikit-image onnx
      - name: Extract latest original TAMU tree image
        run: |
          mkdir -p sf3d-output
          python - <<'PY'
          import zipfile,io
          from PIL import Image
          p='TAMU_Doga_Assetleri_Bolum_2_Agaclar_20261112.zip'
          source='trees/ashskin_birch/albedo.png'
          with zipfile.ZipFile(p) as z:
              image=Image.open(io.BytesIO(z.read(source))).convert('RGBA')
          image.save('sf3d-output/source_albedo.png')
          print('TREE_ALBEDO_OK',source,image.size,flush=True)
          PY
      - name: Download needle-tools ONNX assets and validate manifest
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from huggingface_hub import snapshot_download
          dst=Path(os.environ['RUNNER_TEMP'])/'sf3d-onnx'
          snapshot_download(repo_id='needle-tools/SF3D-webgpu',local_dir=dst,allow_patterns=['onnx/*.onnx','tets_*.bin','features_mlp_weights.json','assets-manifest.json'])
          manifest=json.loads((dst/'assets-manifest.json').read_text())
          for name,meta in manifest['assets'].items():
              p=dst/name
              assert p.exists(),name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for part in iter(lambda:f.read(4*1024*1024),b''):h.update(part)
              assert p.stat().st_size==meta['bytes'] and h.hexdigest()==meta['sha256'],f'Asset integrity mismatch: {name}'
              print('ASSET_VERIFIED',name,p.stat().st_size,flush=True)
          Path('sf3d-output/manifest_verified.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Run ONNX CPU graph diagnostics and first-stage inference
        run: |
          cat > /tmp/sf3d_onnx.py <<'PY'
          import os,json,time,traceback
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import onnxruntime as ort
          root=Path(os.environ['RUNNER_TEMP'])/'sf3d-onnx'
          out=Path('sf3d-output')
          image=Image.open(out/'source_albedo.png').convert('RGBA')
          a=np.asarray(image.getchannel('A'))
          y,x=np.where(a>127)
          if not len(x):raise RuntimeError('empty input alpha')
          crop=image.crop((int(x.min()),int(y.min()),int(x.max()+1),int(y.max()+1)))
          size=max(crop.size); canvas=Image.new('RGBA',(size,size),(0,0,0,0))
          canvas.alpha_composite(crop,((size-crop.width)//2,(size-crop.height)//2))
          canvas=canvas.resize((int(size/.85),)*2)
          canvas=canvas.resize((512,512),Image.Resampling.BICUBIC)
          canvas.save(out/'model_input_rgba.png')
          arr=np.asarray(canvas).astype(np.float32)/255.
          rgb=arr[:,:,:3]*arr[:,:,3:]+.5*(1-arr[:,:,3:])
          opts=ort.SessionOptions()
          opts.intra_op_num_threads=2
          opts.graph_optimization_level=ort.GraphOptimizationLevel.ORT_ENABLE_ALL
          report={'source':'trees/ashskin_birch/albedo.png','model':'needle-tools/SF3D-webgpu','device':'CPUExecutionProvider','graphs':{}}
          sessions={}
          for name in ['image_tokenizer_single','backbone_fp16','decoder_single']:
              p=root/'onnx'/f'{name}.onnx'
              t=time.monotonic()
              try:
                  sess=ort.InferenceSession(str(p),sess_options=opts,providers=['CPUExecutionProvider'])
                  sessions[name]=sess
                  graph={'load_seconds':round(time.monotonic()-t,2),
                    'inputs':[{'name':v.name,'shape':v.shape,'type':v.type} for v in sess.get_inputs()],
                    'outputs':[{'name':v.name,'shape':v.shape,'type':v.type} for v in sess.get_outputs()]}
                  print('GRAPH_OK',name,json.dumps(graph),flush=True)
              except Exception as exc:
                  graph={'error':type(exc).__name__+': '+str(exc)}
                  print('GRAPH_FAIL',name,graph['error'],flush=True)
              report['graphs'][name]=graph
              (out/'onnx_report.json').write_text(json.dumps(report,indent=2))
          if 'image_tokenizer_single' not in sessions:
              raise RuntimeError('Cannot load image tokenizer on CPU')
          enc=sessions['image_tokenizer_single']
          feeds={}
          for inp in enc.get_inputs():
              shape=inp.shape;dims=[v if isinstance(v,int) and v>0 else 1 for v in shape]
              typ=np.float16 if 'float16' in inp.type else np.float32
              if len(dims)==4 and dims[1]==3:
                  value=rgb.transpose(2,0,1)[None]
                  if dims[2]!=512 or dims[3]!=512:
                      value=np.asarray(Image.fromarray(np.uint8(rgb*255)).resize((dims[3],dims[2]))).transpose(2,0,1)[None]/255.
              elif len(dims)==4 and dims[-1]==3:
                  value=rgb[None]
              else:
                  raise RuntimeError(f'Unrecognized encoder input {inp.name}: {shape}')
              feeds[inp.name]=value.astype(typ)
          t=time.monotonic()
          outputs=enc.run(None,feeds)
          report['encoder_result']={'seconds':round(time.monotonic()-t,2),'tensors':[{'shape':list(v.shape),'dtype':str(v.dtype),'min':float(v.min()),'max':float(v.max())} for v in outputs]}
          (out/'onnx_report.json').write_text(json.dumps(report,indent=2))
          print('IMAGE_ENCODER_OK',json.dumps(report['encoder_result']),flush=True)
          PY
          python /tmp/sf3d_onnx.py
      - name: Upload CPU test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamu-sf3d-onnx-cpu
          path: sf3d-output/
          if-no-files-found: warn
