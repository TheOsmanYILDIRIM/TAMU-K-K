name: TAMU Stable Fast 3D CPU tree trial
on:
  push:
    branches: [experiment/tamu-3d-stock-stack-20261113]
    paths: [.github/workflows/sf3d-tree-cpu.yml]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SF3D_USE_CPU: "1"
      USE_CUDA: "0"
      MAX_JOBS: "2"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System tools for SF3D native extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev build-essential ninja-build
      - name: Install CPU PyTorch and official SF3D implementation
        run: |
          python -m pip install -U pip setuptools==69.5.1 wheel ninja
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/Stability-AI/stable-fast-3d.git /tmp/stable-fast-3d
          cd /tmp/stable-fast-3d
          sed 's/rembg\[gpu\]/rembg/' requirements.txt > /tmp/sf3d-cpu-requirements.txt
          python -m pip install -r /tmp/sf3d-cpu-requirements.txt
          python -m pip install -e . --no-deps || true
          python -c "from sf3d.system import SF3D; print('SF3D_IMPORT_OK')"
      - name: Extract original TAMU tree albedo from uploaded archive
        run: |
          mkdir -p sf3d-output
          python - <<'PY'
          import zipfile,io
          from pathlib import Path
          from PIL import Image
          arc=Path('TAMU_Doga_Assetleri_Bolum_2_Agaclar_20261112.zip')
          if not arc.is_file(): raise FileNotFoundError(str(arc))
          name='trees/ashskin_birch/albedo.png'
          with zipfile.ZipFile(arc) as z:
              if name not in z.namelist(): raise FileNotFoundError(name)
              data=z.read(name)
          im=Image.open(io.BytesIO(data)).convert('RGBA')
          if im.getchannel('A').getextrema()[0]==255: raise RuntimeError('Expected transparent tree albedo')
          im.save('sf3d-output/source_albedo.png')
          print('TREE_ALBEDO_OK',name,im.size,flush=True)
          PY
      - name: Run official Stable Fast 3D (CPU) and verify GLB
        run: |
          cd /tmp/stable-fast-3d
          python - <<'PY'
          import time,json,sys,traceback,os
          from pathlib import Path
          from PIL import Image
          import torch
          from sf3d.system import SF3D
          from sf3d.utils import resize_foreground
          import trimesh
          out=Path(os.environ['GITHUB_WORKSPACE'])/'sf3d-output'
          try:
              im=Image.open(out/'source_albedo.png').convert('RGBA')
              im=resize_foreground(im,.85)
              im.save(out/'model_input_rgba.png')
              print('SF3D_MODEL_LOAD_START HF_TOKEN_PRESENT=',bool(os.getenv('HF_TOKEN')),flush=True)
              t0=time.monotonic()
              model=SF3D.from_pretrained('stabilityai/stable-fast-3d',config_name='config.yaml',weight_name='model.safetensors')
              model.to('cpu').eval()
              print('SF3D_MODEL_LOAD_OK',round(time.monotonic()-t0,2),flush=True)
              with torch.no_grad():
                  mesh,_=model.run_image(im,bake_resolution=512,remesh='none',vertex_count=-1)
              path=out/'tree_3d_sf3d.glb'
              mesh.export(str(path),include_normals=True)
              check=trimesh.load(str(path),force='scene')
              vertex_count=sum(len(g.vertices) for g in check.geometry.values())
              face_count=sum(len(g.faces) for g in check.geometry.values())
              if not vertex_count or not face_count:raise RuntimeError('Empty GLB mesh')
              metrics=dict(model='stabilityai/stable-fast-3d',device='cpu',source='trees/ashskin_birch/albedo.png',vertices=vertex_count,triangles=face_count,seconds=round(time.monotonic()-t0,2),glb_bytes=path.stat().st_size)
              (out/'metrics.json').write_text(json.dumps(metrics,indent=2))
              print('SF3D_GLB_VERIFIED',metrics,flush=True)
          except Exception as exc:
              (out/'error.txt').write_text(type(exc).__name__+': '+str(exc)+'\n')
              traceback.print_exc()
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-sf3d-tree-cpu
          path: sf3d-output/
          if-no-files-found: warn
