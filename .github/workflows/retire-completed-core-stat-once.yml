name: One-time retire merged Core stat experiment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-completed-core-stat-once.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    if: github.repository == 'TheOsmanYILDIRIM/oyun'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='TheOsmanYILDIRIM',repo='oyun',ref='heads/experiment/core-stat-runtime-20261018';
            if(context.repo.owner!==owner||context.repo.repo!==repo||context.ref!=='refs/heads/main')throw new Error('Wrong repo');
            const head=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;
            if(head!=='8fb5e8978e162fbf560bd19efe9facb378a98788')throw new Error('Branch moved; preserve');
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const compare=await github.rest.repos.compareCommits({owner,repo,base:head,head:main});
            if(compare.data.ahead_by<1||compare.data.behind_by!==0)throw new Error('Branch contains unmerged commits');
            for(const path of ['game/love/progression/character.lua','game/love/progression/rules.lua','game/love/progression/skill_contract.lua','game/love/tests/core_stat_progression.lua']){
              await github.rest.repos.getContent({owner,repo,path,ref:'main'});
            }
            await github.rest.git.deleteRef({owner,repo,ref});
            try{await github.rest.git.getRef({owner,repo,ref});throw new Error('Ref remained')}catch(err){if(err.status!==404)throw err}
            core.info('DELETED completed core stat branch '+head+'; main '+main+' includes all commits');
