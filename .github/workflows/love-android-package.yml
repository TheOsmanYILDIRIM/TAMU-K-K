name: Build Android-testable LOVE package
on:
  push:
    branches: [main, experiment/25d-blackboot-diagnosis-20261029]
    paths:
      - '.github/workflows/love-android-package.yml'
      - 'game/love/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-love:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged R2 maps and Lua contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          r=Path('game/love/assets/worldbuild')
          for name,h in {
            'fisilti_ormani.r2.v1.json':'df5d0eeca59030e6585558c15d8f1e7bf049638ea8032dc17c1b80c74106f598',
            'osman_overworld.v2.json':'ac5903fd22cd466cfc1786cbeef44f2679be87317c6bfd757a05a282172f78dc'
          }.items(): assert hashlib.sha256((r/name).read_bytes()).hexdigest()==h,name
          print('R2_PACKAGED_SOURCE_OK')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 luajit love xvfb
          cd game/love
          luac5.4 -p main.lua world/r2_playable.lua
          luajit -b main.lua /tmp/tamu-android-main-luajit.bytecode
          test -s /tmp/tamu-android-main-luajit.bytecode
          lua5.4 tests/r2_pilot_contract.lua
          lua5.4 tests/terrain25d_runtime.lua
          lua5.4 tests/terrain25d_object_population.lua
          cd ../..

      - name: Precompile exact R2 authored terrain into the playable package
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/tamu-mobile-bake"
          mkdir -p "$XDG_DATA_HOME"
          SDL_AUDIODRIVER=dummy OSMAN_25D_BAKE=1 timeout 420s xvfb-run -a love game/love 2>&1 | tee prebaked-compile.log
          grep -q 'TAMU_25D_BAKE_BUILD_OK' prebaked-compile.log
          mkdir -p game/love/assets/terrain25d/baked
          find "$XDG_DATA_HOME" -name 'c_*.json.z' -exec cp {} game/love/assets/terrain25d/baked/ \;
          count="$(find game/love/assets/terrain25d/baked -name 'c_*.json.z' | wc -l)"
          test "$count" -ge 16
          printf 'TAMU_PACKAGED_BAKED_CHUNKS=%s\n' "$count"
          du -sh game/love/assets/terrain25d/baked
      - name: Validate and package playable LÖVE source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib,struct
          root=Path('game/love')
          needed=['main.lua','player/core_visual.lua','player/core_crystal_shader.lua',
          'assets/file_000000007cf082119c4dde3e346c2bcb.png',
          'assets/core_crystal_mask_aligned.png',
          'assets/core_plasma_back_spritesheet_32x512.png',
          'assets/core_plasma_front_spritesheet_32x512.png']
          for name in needed:
              assert (root/name).is_file(), f'Missing: {name}'
          expected={
          'assets/file_000000007cf082119c4dde3e346c2bcb.png':'2c63bc1645ab1718e8f612f17a8821ed4f22cd557ffd66c2e506e8d46d2dcf0b',
          'assets/core_crystal_mask_aligned.png':'b718d0cab981f23d8334a868e268d45535fac61292af8d34733120999161f55b'}
          for name,sha in expected.items():
              blob=(root/name).read_bytes()
              assert hashlib.sha256(blob).hexdigest()==sha,f'{name} SHA mismatch'
              assert blob[:8]==bytes((137,80,78,71,13,10,26,10)),f'{name} PNG invalid'
              assert struct.unpack('>II',blob[16:24])==(1254,1254),f'{name} resolution invalid'
          # Package entire running game tree, not test-only dummy main.lua.
          files=sorted(p for p in root.rglob('*') if p.is_file() and
              not any(part.startswith('.') for part in p.relative_to(root).parts) and
              '__pycache__' not in p.parts)
          out=Path('oyun-main-android-test.love')
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for p in files:
                  z.write(p,p.relative_to(root).as_posix())
          with ZipFile(out) as z:
              assert z.testzip() is None
              assert all(name in z.namelist() for name in needed)
              assert z.namelist()[0] != 'game/love/main.lua'
              print('LOVE_PACKAGE_FILE_COUNT',len(z.namelist()))
          print('LOVE_SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          print('LOVE_BYTES',out.stat().st_size)
          PY
          sha256sum oyun-main-android-test.love | tee oyun-main-android-test.love.sha256
      - name: Trace packaged Android startup Rigby versus plasma (diagnostic branch only)
        if: github.ref_name == 'experiment/25d-blackboot-diagnosis-20261029'
        run: |
          set +e
          SDL_AUDIODRIVER=dummy TAMU_BOOT_TRACE=1 OSMAN_LOVE_INTEGRATION_SMOKE=1 timeout 55s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee /tmp/rigby-package-startup.log
          rigby_status=${PIPESTATUS[0]}
          echo "TAMU_DIAG_RIGBY_STATUS=$rigby_status"
          SDL_AUDIODRIVER=dummy TAMU_USE_PLASMA=1 TAMU_BOOT_TRACE=1 OSMAN_LOVE_INTEGRATION_SMOKE=1 timeout 55s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee /tmp/plasma-package-startup.log
          plasma_status=${PIPESTATUS[0]}
          echo "TAMU_DIAG_PLASMA_STATUS=$plasma_status"
          exit 0
      - name: Test packaged R2 + 25D in real LÖVE, and preserve explicit legacy mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('oyun-main-android-test.love') as z:
            assert z.testzip() is None
            for name in ('assets/worldbuild/fisilti_ormani.r2.v1.json','assets/worldbuild/osman_overworld.v2.json'):
              assert name in z.namelist()
          PY
          SDL_AUDIODRIVER=dummy OSMAN_LOVE_INTEGRATION_SMOKE=1 timeout 60s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee r2-25d-package-smoke.log
          grep -q LOVE_INTEGRATION_SMOKE_OK r2-25d-package-smoke.log
          SDL_AUDIODRIVER=dummy OSMAN_R2_PILOT=0 OSMAN_25D_RUNTIME=0 OSMAN_LOVE_INTEGRATION_SMOKE=1 timeout 120s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee legacy-smoke.log
          grep -q LOVE_INTEGRATION_SMOKE_OK legacy-smoke.log
      - name: Verify packaged authored mesh reload without CPU terrain generation
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/tamu-baked-replay"
          mkdir -p "$XDG_DATA_HOME"
          SDL_AUDIODRIVER=dummy OSMAN_25D_BAKE_VERIFY=1 timeout 180s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee prebaked-replay.log
          grep -q 'TAMU_25D_BAKE_VERIFY_OK' prebaked-replay.log
          shot="$(find "$XDG_DATA_HOME" -name 'tamu-prebaked-startup.png' -print -quit)"
          test -n "$shot" && test -s "$shot"
          cp "$shot" tamu-prebaked-startup.png
      - name: Verify default R2 terrain actually becomes visible in the packaged game
        run: |
          set -euo pipefail
          SDL_AUDIODRIVER=dummy OSMAN_25D_VISUAL_PROBE=1 timeout 240s xvfb-run -a love oyun-main-android-test.love 2>&1 | tee default-world-visual.log
          grep -q 'TAMU_25D_VISIBLE_OK' default-world-visual.log
          shot="$(find "$HOME/.local/share/love" -name 'tamu-default-world-visible.png' -print -quit)"
          test -n "$shot" && test -s "$shot"
          cp "$shot" tamu-default-world-visible.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b=Path('tamu-default-world-visible.png').read_bytes()
          assert b[:8]==bytes((137,80,78,71,13,10,26,10))
          w,h=struct.unpack('>II',b[16:24])
          assert w>=320 and h>=480,(w,h)
          print('TAMU_DEFAULT_SCREENSHOT_OK',w,h,len(b))
          PY
      - name: Upload playable LOVE file
        uses: actions/upload-artifact@v4
        with:
          name: oyun-main-android-love
          path: |
            oyun-main-android-test.love
            oyun-main-android-test.love.sha256
            r2-25d-package-smoke.log
            legacy-smoke.log
            default-world-visual.log
            tamu-default-world-visible.png
            prebaked-compile.log
            prebaked-replay.log
            tamu-prebaked-startup.png
          if-no-files-found: error
