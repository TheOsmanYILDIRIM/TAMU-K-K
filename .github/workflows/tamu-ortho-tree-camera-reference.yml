name: TAMU orthographic tree camera references
on:
  push:
    branches:
      - experiment/tamu-ortho-tree-camera-ref-20261111
    paths:
      - .github/workflows/tamu-ortho-tree-camera-reference.yml
      - scripts/render_tree_camera_ref_fast.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install small Python renderer
        run: python3 -m pip install --disable-pip-version-check --quiet trimesh numpy matplotlib
      - name: Download pinned CC0 3D oak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fLSs --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/ebfd758dea8db5793c765cc72564efadb36a4ed0/models/environment/tree_oak.glb \
            -o source/tree_oak.glb
          python3 - <<'PY'
          import os,struct
          with open('source/tree_oak.glb','rb') as f: magic,ver,size=struct.unpack('<4sII',f.read(12))
          assert (magic,ver,size)==(b'glTF',2,os.path.getsize('source/tree_oak.glb'))
          PY
      - name: Render true orthographic 30-degree reference
        run: python3 scripts/render_tree_camera_ref_fast.py
      - name: Verify artifact
        run: |
          python3 - <<'PY'
          import os,struct
          path='tree-camera-refs/oak_ortho_elev_30.png'
          with open(path,'rb') as f: sig=f.read(24)
          assert sig[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',sig[16:24])==(1024,1024)
          assert os.path.getsize(path)>3000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tamu-tree-camera-references-fast
          path: tree-camera-refs/
          retention-days: 30
          if-no-files-found: error
