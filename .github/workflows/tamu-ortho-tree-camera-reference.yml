name: TAMU orthographic tree camera references
on:
  push:
    branches:
      - experiment/tamu-ortho-tree-camera-ref-20261111
    paths:
      - .github/workflows/tamu-ortho-tree-camera-reference.yml
      - scripts/render_tree_camera_refs.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Download pinned CC0 Kenney oak from GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fLSs --retry 3 --max-time 60 \
            "https://raw.githubusercontent.com/syuhei176/ai-game-assets/ebfd758dea8db5793c765cc72564efadb36a4ed0/models/environment/tree_oak.glb" \
            -o source/tree_oak.glb
          python3 - <<'PY'
          import os, struct
          p = 'source/tree_oak.glb'
          with open(p,'rb') as f:
              magic, version, length = struct.unpack('<4sII',f.read(12))
          assert magic == b'glTF' and version == 2 and length == os.path.getsize(p)
          print('TAMU_CC0_GLB_OK', length)
          PY
      - name: Render true orthographic elevations
        env:
          TAMU_TREE_GLB: source/tree_oak.glb
          TAMU_OUT: tree-camera-refs
        run: blender --background --factory-startup --python scripts/render_tree_camera_refs.py
      - name: Verify output PNGs
        run: |
          python3 - <<'PY'
          import os,struct
          for e in [20,30,40,50]:
              p=f'tree-camera-refs/oak_ortho_elev_{e:02d}.png'
              with open(p,'rb') as f: sig=f.read(24)
              assert sig[:8] == b'\x89PNG\r\n\x1a\n',p
              assert struct.unpack('>II',sig[16:24]) == (1024,1024),p
              assert os.path.getsize(p)>10000,p
              print('PNG_OK',p,os.path.getsize(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tamu-tree-camera-references
          path: tree-camera-refs/
          retention-days: 30
          if-no-files-found: error
