name: Godot visual Android APK
on:
  push:
    branches:
      - experiment/godot-visual-apk-20261028
    paths:
      - 'demos/godot-visual/**'
      - '.github/workflows/godot-visual-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Install user-approved repository atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demos/godot-visual/assets demos/godot-visual/build
          cp game/love/assets/terrain25d/atlas_00.png demos/godot-visual/assets/
          cp game/love/assets/terrain25d/manifest.json demos/godot-visual/assets/
          python - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path("demos/godot-visual/assets")
          m=json.loads((d/"manifest.json").read_text())
          for page in m["atlas_pages"]:
              p=d/page["filename"]
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==page["sha256"]
          print("ATLAS_VERIFIED",len(m["assets"]))
          PY
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Godot import and Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euxo pipefail
          godot --headless --path demos/godot-visual --editor --import
          godot --headless --path demos/godot-visual --export-debug Android build/OSMAN-Godot-Visual.apk
          test -s demos/godot-visual/build/OSMAN-Godot-Visual.apk
          unzip -t demos/godot-visual/build/OSMAN-Godot-Visual.apk | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: OSMAN-Godot-Visual-APK
          path: demos/godot-visual/build/OSMAN-Godot-Visual.apk
          if-no-files-found: error
