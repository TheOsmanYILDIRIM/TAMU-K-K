name: One-time retire verified LOVE package experiment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-verified-love-package-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  retire:
    runs-on: ubuntu-latest
    if: github.repository == 'TheOsmanYILDIRIM/oyun'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='TheOsmanYILDIRIM', repo='oyun',ref='heads/experiment/love-android-package-20261018';
            if(context.repo.owner!==owner||context.repo.repo!==repo||context.ref!=='refs/heads/main') throw new Error('Unexpected target');
            const run=await github.rest.actions.getWorkflowRun({owner,repo,run_id:39125999396});
            if(run.data.head_sha!=='114ca307bda97f9d0a4002b6898bf74a70cbe782'||run.data.conclusion!=='success')throw new Error('Main package CI not accepted');
            const artifacts=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:39125999396});
            if(!artifacts.data.artifacts.some(a=>a.name==='oyun-main-android-love'&&!a.expired&&a.digest))
              throw new Error('Verified main artifact missing');
            const mainWorkflow=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/love-android-package.yml',ref:'main'});
            const source=Buffer.from(mainWorkflow.data.content,'base64').toString('utf8');
            if(!source.includes('branches: [main]')||!source.includes('core_plasma_front_spritesheet_32x512.png'))
              throw new Error('Main packaging workflow missing');
            const old=await github.rest.git.getRef({owner,repo,ref});
            if(old.data.object.sha!=='417e892d9959d955d92e5fed565064c605b27234')throw new Error('Experiment SHA moved');
            await github.rest.git.deleteRef({owner,repo,ref});
            try{await github.rest.git.getRef({owner,repo,ref});throw new Error('Experiment ref remains')}catch(err){if(err.status!==404)throw err}
            core.info('DELETED '+ref+' after verified main artifact #12135304051');
