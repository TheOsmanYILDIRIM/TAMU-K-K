name: Retire verified World Builder experiment ref once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-world-builder-once.yml']
permissions:
  contents: write
jobs:
  retire:
    if: github.repository == 'TheOsmanYILDIRIM/oyun'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='TheOsmanYILDIRIM',repo='oyun',ref='heads/experiment/world-2d-design-20261012';
            const expected='4c9a485dffd650864bf06d8d7b4cc9e3c8ba648a';
            const sources={"world-builder/index.html":"198ae72eacf256799b1f7b5246e8c5ef7ee68c0a","world-builder/style.css":"5643e75848b38bc5d1ae0b5e674b41fa727e1147","world-builder/app.js":"7cc84245969226fe9540b72938d2bf1d9599c181","world-builder/assembly.html":"0543ca618a991dd38159fdc163e1be4a9933e6fa","world-builder/assembly.js":"b5972f80a968890b5366229c9a7572bb24751a1e","docs/12_WORLD_2D_DIRECTION_20261012.md":"4b2eb56104c63a0700d983ec2ae84007f7b05182"};
            if (context.repo.owner!==owner || context.repo.repo!==repo || context.ref!=='refs/heads/main') throw new Error('Wrong repo/ref');
            for(const [path,sha] of Object.entries(sources)){
              const file=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              if(file.data.sha!==sha) throw new Error('Source changed: '+path);
            }
            const wf=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/object-studio-pages.yml',ref:'main'});
            const content=Buffer.from(wf.data.content,'base64').toString('utf8');
            if(!content.includes('--preview world-builder')||content.includes('ref: experiment/world-2d-design-20261012'))
              throw new Error('Pages still depend on experiment ref');
            const old=await github.rest.git.getRef({owner,repo,ref});
            if(old.data.object.sha!==expected) throw new Error('World Builder branch changed');
            await github.rest.git.deleteRef({owner,repo,ref});
            try{await github.rest.git.getRef({owner,repo,ref});throw new Error('Deleted ref still present')}catch(error){if(error.status!==404)throw error}
            core.info('DELETED branch '+ref+' @ '+expected+'; all six original source blobs preserved in main');
