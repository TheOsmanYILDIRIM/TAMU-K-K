name: TAMU 45-degree two-view Blender bake
on:
  push:
    branches: [experiment/25d-two-view-3d-20261031]
    paths:
      - .github/workflows/tamu-two-view-blender-bake.yml
      - scripts/bake_3d_profile_character.py
      - scripts/package_tamu_3d_test_love.py
      - 'Adventurer by Quaternius - 5EGWBMpuXq.glb'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tamu-two-view-bake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bake:
    if: github.repository == 'TheOsmanYILDIRIM/TAMU-K-K' && github.ref == 'refs/heads/experiment/25d-two-view-3d-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Blender, Pillow, Lua, LuaJIT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil lua5.4 luajit love xvfb
          blender --version | head -n 2
      - name: Render animated true side-profile atlas
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 7 --python scripts/bake_3d_profile_character.py -- --repo . --frames 8 --width 128 --height 192 --fps 12
      - name: Verify image, two rows, frames, source hashes and alpha pivots
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root = Path("game/love/assets/character_side_bake")
          img_path = root / "atlas.png"
          m = json.loads((root / "manifest.json").read_text())
          src = Path(m["source"])
          checksum = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert src.name == "Adventurer by Quaternius - 5EGWBMpuXq.glb"
          assert checksum(src) == m["source_sha256"]
          assert checksum(img_path) == m["atlas_sha256"]
          assert m["version"] == 2 and m["camera_pitch_degrees"] == 0 and m["world_camera_pitch_degrees"] == 45
          assert m["bottom_center_pivot"] is True
          assert m["rows"] == {"side_idle":0,"side_walk":1}
          assert m["views"] == {"SE":["side",False],"SW":["side",True],"NE":["side",False],"NW":["side",True]}
          assert m["frames"] == 8 and m["fps"] == 12
          with Image.open(img_path) as img:
              img.load()
              assert img.mode == "RGBA", img.mode
              w,h,n = m["width"],m["height"],m["frames"]
              assert img.size == (w*n,h*2),img.size
              for row in range(2):
                  unique = set()
                  for frame in range(n):
                      tile = img.crop((frame*w,row*h,(frame+1)*w,(row+1)*h))
                      bbox = tile.getchannel("A").getbbox()
                      assert bbox and bbox[0]>0 and bbox[1]>0 and bbox[2]<w and bbox[3]<h, (row,frame,bbox)
                      unique.add(hashlib.sha256(tile.tobytes()).hexdigest())
                  if row == 1:
                      assert len(unique)>1, f"walk has no animation, row={row}"
              print("TAMU_3D_ATLAS_VALIDATED",img.size,checksum(img_path))
          PY
      - name: Check Lua sprite mapping and renderer
        shell: bash
        run: |
          set -euo pipefail
          luac5.4 -p game/love/player/side_baked_visual.lua
          luac5.4 -p game/love/objects/renderer.lua
          luajit -b game/love/player/side_baked_visual.lua "$RUNNER_TEMP/tamu-side-avatar.ljc"
          cd game/love
          lua5.4 tests/side_baked_visual.lua
          luajit tests/side_baked_visual.lua
      - name: Upload verified atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamu-3d-two-view-verified-atlas
          path: |
            game/love/assets/character_side_bake/atlas.png
            game/love/assets/character_side_bake/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated binary only on unchanged experiment HEAD
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = "experiment/25d-two-view-3d-20261031"
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "Experiment branch advanced while baking; preserving artifact without overwrite."
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/love/assets/character_side_bake/atlas.png game/love/assets/character_side_bake/manifest.json
          if git diff --cached --quiet; then
            echo "Atlas unchanged";
          else
            git commit -m "assets(tamu): 45-degree Quaternius two-view animated atlas"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo TAMU_3D_ATLAS_COMMITTED

      - name: Setup modern Python for existing creative asset packager
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow 12 (get_flattened_data API)
        run: python3 -m pip install 'Pillow>=12.0,<13'
      - name: Package isolated 3D avatar full-game .love
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/package_tamu_3d_test_love.py
          python3 scripts/package_tamu_3d_test_love.py --repo . --output ci-output/TAMU-3D-Avatar-TEST.love
          luac5.4 -p game/love/objects/renderer.lua game/love/main.lua
          test -s ci-output/TAMU-3D-Avatar-TEST.love
      - name: Real LÖVE/Xvfb boot and avatar render screenshot
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/tamu-3d-game"
          mkdir -p "$XDG_DATA_HOME"
          SDL_AUDIODRIVER=dummy TAMU_BAKED_DEMO_SMOKE=1 timeout 125s xvfb-run -a love ci-output/TAMU-3D-Avatar-TEST.love 2>&1 | tee "$RUNNER_TEMP/tamu-3d-game.log"
          grep -q 'TAMU_3D_GAME_REAL_LOVE_OK' "$RUNNER_TEMP/tamu-3d-game.log"
          find "$XDG_DATA_HOME" -name 'tamu-3d-game-smoke.png' -size +0c -exec cp {} ci-output/tamu-3d-game-smoke.png \;
          test -s ci-output/tamu-3d-game-smoke.png
          echo TAMU_3D_GAME_SCREENSHOT_OK
      - name: Upload special playable full-game 3D avatar .love
        uses: actions/upload-artifact@v4
        with:
          name: tamu-special-side-profile-love
          path: |
            ci-output/TAMU-3D-Avatar-TEST.love
            ci-output/tamu-3d-game-smoke.png
          if-no-files-found: error
          retention-days: 30
