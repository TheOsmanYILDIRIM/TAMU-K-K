name: TAMU MobileSAM CPU creature segmentation
on:
  push:
    branches: [experiment/sam31-creature-segmentation-20261103]
    paths:
      - .github/workflows/tamu-sam31-creature.yml
      - scripts/sam31_creature.py
      - assets/creatures/yaprakkulak/source.png
  workflow_dispatch:
permissions:
  contents: read
jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source
        run: |
          set -euo pipefail
          test -s assets/creatures/yaprakkulak/source.png || { echo "::error::Source PNG missing in repository"; exit 8; }
      - name: Install MobileSAM CPU
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pillow==11.2.1 opencv-python-headless==4.10.0.84 timm==1.0.15
          git clone --depth 1 https://github.com/ChaoningZhang/MobileSAM.git /tmp/mobile-sam
          python -m pip install -e /tmp/mobile-sam
          curl -fL --retry 3 --max-time 120 https://github.com/ChaoningZhang/MobileSAM/raw/refs/heads/master/weights/mobile_sam.pt -o /tmp/mobile_sam.pt
          test "$(stat -c%s /tmp/mobile_sam.pt)" -gt 30000000
      - name: Segment nine parts with MobileSAM on CPU
        run: |
          set -euo pipefail
          python scripts/sam31_creature.py --input assets/creatures/yaprakkulak/source.png --checkpoint /tmp/mobile_sam.pt --output ci-output/creature
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          from PIL import Image
          root=Path('ci-output/creature')
          m=json.loads((root/'manifest.json').read_text())
          assert len(m['parts'])==9
          for p in m['parts']:
              with Image.open(root/(p['name']+'.png')) as im:
                  assert im.mode=='RGBA' and im.getchannel('A').getbbox()
          with zipfile.ZipFile(root/'nine_parts.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in root.glob('*.png'):z.write(f,f.name)
              z.write(root/'manifest.json','manifest.json')
          with zipfile.ZipFile(root/'nine_parts.zip') as z: assert z.testzip() is None
          print('TAMU_MOBILESAM_OUTPUT_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-mobilesam-nine-parts
          path: ci-output/creature/
          if-no-files-found: warn
          retention-days: 14
