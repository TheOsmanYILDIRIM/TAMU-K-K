name: One-time completed experiment ref cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-completed-experiments-once.yml']
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'TheOsmanYILDIRIM/oyun'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const expected = {
              "experiment/axe-harvest-runtime-20261017": "550a968f515f050cb6ca43263fe624c7af513e52",
              "experiment/core-axe-corepng-integration-20261017": "decc19e7a4d7e6eda4f33631672932c184737966",
              "experiment/core-axe-strike-fx-20261017": "46353f91ef7eb9de90caacb704c6c37c38aabf1f",
              "experiment/core-axe-visual-acceptance-20261017": "d12f1c468cfd84fd9493e0599565b5bea2b4439a",
              "experiment/core-crystal-realasset-20261018": "4fafd5c05a8f5bd9ffdf77cefdce1472bdce13e9",
              "experiment/core-crystal-realasset-verified-20261018": "e538967bbe546306e4b02158f107fc8b0680c621",
              "experiment/core-crystal-shader-integration-20261016": "dc8a6bcd70f866ddd366f3252f934f8a9f9be849",
              "experiment/core-love-package-20261016": "43f9e919e1e6bd7851c9c1148a0483bdaf0122c4",
              "experiment/core-plasma-art-pipeline-20261016": "8b396d851e21d01e12807bdf36806dd00a8cd683",
              "experiment/core-plasma-avatar-v1": "388452c964c40c50e81fb42d58f8e100de4dcc85",
              "experiment/core-plasma-parametric-main-import-20261018": "cf0bd4428940d96ae94739ed567a1d6a995239d1",
              "experiment/core-plasma-runtime-merged-20261018": "9c7792af488935d0b3a48737ce81b2eb184a6ac8",
              "experiment/core-plasma-runtime-spritesheet-20261018": "ffc043e0d3bd38c48395433aa07e059ce6689a4d",
              "experiment/core-plasma-tool-merge-20261017": "71954ca9229f7dfe65999c7d37abb0fc870ee719",
              "experiment/core-plasma-validation-20261018": "2d314b468d8991f6265797899a51606a68f4f5ed",
              "experiment/data-architecture-audit-20261015": "d715115397ced7f5f3403e0a5d5cf4511e49ead0",
              "experiment/liquid-traversal-v1": "74780932c270bae6fad5d906d6cc15eca05d55ff",
              "experiment/love-phone-bundle-20261015": "49521da68f8f1eb59661f7fc6593a66e4aefca25",
              "experiment/player-systems-v1": "f37e6cc58b08fd6b10916f042e613bc91c376027",
              "experiment/stage5-inventory-crafting-v1": "c222e5de1726ba80edfbb54acc0b41a8a6bb8991",
              "experiment/stage5-stage6-integration-v1": "578bf16667ce963c3f7a7d8dc1f1aef1ee2e2c0e",
              "experiment/stage6-save-v2": "0b5b82d6e4e34017856e9255d4cf0426b3b6121e",
              "experiment/world-generation-v2": "ef95b23c3b0d174a0c48e0ee43c10cea28b1bf51",
              "experiment/world-objects-harvesting-v1": "eaa41a4574ada87743bd4ef829419cfc412ee2d8",
              "experiment/world-player-integration-v1": "fad67195ac0609d8e23d82ba43fc326b43ad1bc8"
            };
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main' || owner !== 'TheOsmanYILDIRIM' || repo !== 'oyun') {
              throw new Error('Unexpected target context');
            }
            let deleted = 0;
            const preserved = [];
            for (const [name, sha] of Object.entries(expected)) {
              if (!name.startsWith('experiment/') || !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid allowlist');
              const ref = 'heads/' + name;
              try {
                const fetched = await github.rest.git.getRef({owner,repo,ref});
                if (fetched.data.object.sha !== sha) { preserved.push({name,reason:'SHA_MOVED'}); continue; }
                await github.rest.git.deleteRef({owner,repo,ref});
                try {
                  await github.rest.git.getRef({owner,repo,ref});
                  preserved.push({name,reason:'STILL_EXISTS'});
                } catch (err) {
                  if (err.status !== 404) throw err;
                  deleted++;
                  core.info('DELETED ' + name + ' @ ' + sha);
                }
              } catch (err) {
                preserved.push({name,reason:'ERROR_' + (err.status || 'unknown')});
              }
            }
            core.info(JSON.stringify({deleted,preserved}));
            if (deleted + preserved.length !== Object.keys(expected).length || preserved.length) {
              core.setFailed('Not all branches pruned; inspect preserved entries');
            }
