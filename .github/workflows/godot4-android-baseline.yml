name: Godot 4.6 PCK and native visual checks
on:
  push:
    branches:
      - experiment/godot4-android-apk-20261031
      - experiment/limboai-godot46-20261104
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# On the same source branch, newer push/PR/dispatch supersedes older
# runs of this workflow. Other branches and other workflows stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  limbo_contract:
    name: Pinned native LimboAI GDExtension 4.6 BT contract (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and load genuine LimboAI v1.8.1 native GDExtension
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/tamu-limbo-godot.zip
          unzip -q /tmp/tamu-limbo-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 'https://github.com/limbonaut/limboai/releases/download/v1.8.1/limboai%2Bv1.8.1.gdextension-4.6.zip' -o /tmp/tamu-limbo-v1.8.1.zip
          echo '0910411f8dbc0da8920f6c8bbbb6397c347cd9f2f193942468a702dfb11d5f0e  /tmp/tamu-limbo-v1.8.1.zip' | sha256sum -c -
          mkdir -p /tmp/tamu-limbo-upstream addons/limboai/bin
          unzip -q /tmp/tamu-limbo-v1.8.1.zip -d /tmp/tamu-limbo-upstream
          manifest="$(find /tmp/tamu-limbo-upstream -type f -name '*.gdextension' -print -quit)"
          test -n "$manifest"
          cp -a "$(dirname "$manifest")/." addons/limboai/bin/
          test -s addons/limboai/bin/limboai.gdextension
          echo "TAMU_LIMBOAI_MANIFEST_PATH=$manifest"
          head -50 addons/limboai/bin/limboai.gdextension
          find addons/limboai/bin -type f | head -20
          timeout --kill-after=3s 75s godot --headless --editor --path . --import --quit 2>&1 | tee limbo-import.log
          timeout --kill-after=3s 40s godot --headless --path . --script res://scripts/mob_limboai_probe_ci.gd 2>&1 | tee limbo-native.log
          grep -q 'TAMU_LIMBOAI_BT_CONTRACT_OK tasks=3 manual=true class=BTPlayer' limbo-native.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_LIMBOAI_.*FAILED|TAMU_LIMBOAI_EXTENSION_MISSING' limbo-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-limboai-native-contract
          path: limbo-native.log
          if-no-files-found: warn
  fx_contract:
    name: Independent Godot FX and audio contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 and execute isolated FX gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot-fx.zip
          unzip -q /tmp/godot-fx.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          # Native MobNavigation must parse independently, not only as a dependency.
          godot --headless --path . --check-only --script res://scripts/mob_navigation.gd 2>&1 | tee /tmp/tamu-mob-native-parse.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/tamu-mob-native-parse.log; then exit 1; fi
          timeout --kill-after=3s 45s godot --headless --path . --script res://scripts/fx_contract_ci.gd 2>&1 | tee fx-contract.log
          grep -q 'TAMU_FX_CONTRACT_OK voices=8' fx-contract.log
          grep -q TAMU_SHADOW_ALPHA_CONTOUR_OK fx-contract.log
          timeout --kill-after=3s 25s godot --headless --path . --script res://scripts/r2_surface_ci.gd 2>&1 | tee r2-surface.log
          grep -q TAMU_R2_SURFACE_PARITY_OK r2-surface.log
          grep -q TAMU_SHADOW_VOLUME_PARITY_OK fx-contract.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_R2_.*FAILED' r2-surface.log; then exit 1; fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid operands|TAMU_FX_CONTRACT_FAILED' fx-contract.log; then exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-pil >/dev/null
          mkdir -p screenshots
          timeout --kill-after=3s 50s xvfb-run -a -s '-screen 0 540x360x24' godot --path . --rendering-method gl_compatibility --resolution 540x360 --script res://scripts/fx_visual_ci.gd 2>&1 | tee fx-visual.log
          grep -q 'TAMU_FX_VISUAL_OK' fx-visual.log
          grep -q TAMU_HARVEST_OUTLINE_VISUAL_OK fx-visual.log
          test -s screenshots/fx-harvest-selection.png
          grep -q TAMU_SHADOW_ALPHA_INSET_OK fx-visual.log
          grep -q 'TAMU_FX_SHADOW_25D_VOLUME_OK azimuths=3' fx-visual.log
          test -s screenshots/fx-shadow-preview.png
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('screenshots/fx-shadow-preview.png').convert('RGB')
          assert a.width>=540 and a.height>=360 and len(set(a.resize((90,60)).getdata()))>18
          bg=a.getpixel((0,0))
          coverage=sum(1 for pixel in a.getdata() if pixel==bg)/float(a.width*a.height)
          assert coverage>0.65, f'FX_VIEWPORT_SCALING_FAILED background_coverage={coverage:.3f}'
          print('TAMU_FX_VISUAL_PIXEL_GATE_OK',a.size)
          PY
          timeout --kill-after=3s 35s godot --headless --path . --script res://scripts/gameplay_contract_ci.gd 2>&1 | tee gameplay-native.log
          grep -q TAMU_NATIVE_GAMEPLAY_CONTRACT_OK gameplay-native.log
          timeout --kill-after=3s 25s godot --headless --path . --script res://scripts/harvest_navigation_ci.gd 2>&1 | tee harvest-navigation.log
          grep -q TAMU_NAV_INCREMENTAL_ASTAR_OK harvest-navigation.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_NAV_.*FAILED' harvest-navigation.log; then exit 1; fi
          mkdir -p /tmp/tamu-fast-save /tmp/tamu-fast-live /tmp/tamu-fast-mods
          for phase in write reopen recovery mod_reject; do
            XDG_DATA_HOME=/tmp/tamu-fast-save TAMU_SAVE_PHASE="$phase" timeout --kill-after=3s 20s godot --headless --path . --script res://scripts/stage6_contract_ci.gd 2>&1 | tee "save-$phase.log"
            grep -q "TAMU_STAGE6_${phase^^}_OK" "save-$phase.log"
          done
          for phase in create reopen replay reject; do
            XDG_DATA_HOME=/tmp/tamu-fast-live TAMU_LIVE_PHASE="$phase" timeout --kill-after=3s 20s godot --headless --path . --script res://scripts/stage6_live_ci.gd 2>&1 | tee "live-$phase.log"
            grep -q "TAMU_STAGE6_LIVE_${phase^^}_OK" "live-$phase.log"
          done
          XDG_DATA_HOME=/tmp/tamu-fast-mods timeout --kill-after=3s 20s godot --headless --path . --script res://scripts/mod_contract_ci.gd 2>&1 | tee mod-fast.log
          grep -q TAMU_USER_MOD_DISK_E2E_OK mod-fast.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-fx-visual-smoke
          path: |
            screenshots/fx-shadow-preview.png
            fx-contract.log
            fx-visual.log
            gameplay-native.log
            save-*.log
            live-*.log
            mod-fast.log
          if-no-files-found: warn
  visual_pck:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 and PCK export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
          godot --headless --version
      - name: Recover exact TAMU binary terrain and texture atlas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tamu-canonical assets/terrain25d chunks
          gh run download 41234831527 --repo "${{ github.repository }}" --name tamu-authored-r2-binary-cache --dir /tmp/tamu-canonical
          python3 - <<'PY'
          import zipfile, zlib, pathlib, json, hashlib
          root=pathlib.Path('/tmp/tamu-canonical')
          archive=next(root.rglob('tamu-authored-compiled.love'))
          z=zipfile.ZipFile(archive)
          out=pathlib.Path('assets/terrain25d')
          for name in ('atlas_00.png','atlas_01.png','manifest.json'):
              (out/name).write_bytes(z.read('assets/terrain25d/'+name))
          parts=sorted(pathlib.Path('game/love/assets/terrain25d').glob('atlas_objects_hires.part[0-9][0-9]'))
          assert len(parts)==8, 'TAMU_HIRES_PART_COUNT_INVALID'
          hires=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(hires).hexdigest()=='eaa7573e51d18d28f7dacb0848476b03724cb71dbdae8b41063dca4e1bb4c625', 'TAMU_HIRES_ATLAS_SHA_MISMATCH'
          assert hires[:8]==b'\\x89PNG\\r\\n\\x1a\\n'.decode('unicode_escape').encode('latin1'), 'TAMU_HIRES_ATLAS_BAD_PNG'
          (out/'atlas_objects_hires.png').write_bytes(hires)
          print('TAMU_HIRES_ATLAS_SHA_OK bytes=',len(hires))
          shadows=pathlib.Path('assets/terrain25d/static_shadow')
          shadows.mkdir(parents=True,exist_ok=True)
          for n in ('objects_shadow_manifest.json','shadows_12.png'):
              (shadows/n).write_bytes(z.read('assets/terrain25d/static_shadow/'+n))
          binaries=next(root.rglob('c_0_0.meta.json')).parent
          count=0
          index=[]
          for meta_path in sorted(binaries.glob('c_*.meta.json')):
              stem=meta_path.name[:-10]
              meta=json.loads(meta_path.read_text())
              raw=zlib.decompress((binaries/(stem+'.verts.z')).read_bytes())
              assert len(raw)==20*sum(x['count'] for x in meta['meshes'])
              pathlib.Path('chunks',stem+'.verts').write_bytes(raw)
              pathlib.Path('chunks',stem+'.json').write_text(json.dumps(meta,separators=(',',':')))
              index.append(stem)
              count+=1
          assert count>=100, f'Expected authored cache >100 chunks, got {count}'
          world=json.loads(z.read('assets/worldbuild/osman_overworld.v2.json'))
          bounds=world['bounds']
          assert (bounds['max_x']-bounds['min_x'])//256==128
          assert (bounds['max_y']-bounds['min_y'])//256==128
          pathlib.Path('chunks/index.json').write_text(json.dumps({'available':index,'bounds':bounds},separators=(',',':')))
          print('TAMU_EXACT_ASSET_GATE_OK chunks=', count,'design_grid=128x128')
          PY
      - name: Export canonical R2 ecology objects using original Lua world logic
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 >/dev/null
          mkdir -p /tmp/tamu-love
          unzip -q "$(find /tmp/tamu-canonical -name tamu-authored-compiled.love -print -quit)" -d /tmp/tamu-love
          mkdir -p /tmp/tamu-love/chunks
          cp game/love/tests/export_godot_population.lua /tmp/tamu-love/tests/export_godot_population.lua
          (cd /tmp/tamu-love && lua5.4 tests/export_godot_population.lua)
          cp /tmp/tamu-love/chunks/r2_objects.json chunks/r2_objects.json
          python3 - <<'PY'
          import json
          data=json.load(open('chunks/r2_objects.json'))
          ids=[o['id'] for o in data['objects']]
          assert len(ids)==len(set(ids)) and len(ids)>100
          assert all(-1024<=o['x']<2304 and -1536<=o['y']<1536 for o in data['objects'])
          print('TAMU_R2_OBJECT_PARITY_OK',len(ids))
          PY
      - name: Verify exact authored source and generate build-only hash manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('chunks')
          idx=json.loads((root/'index.json').read_text())
          objects=json.loads((root/'r2_objects.json').read_text())
          stems=idx['available']
          assert len(stems)==156 and len(set(stems))==156
          ids=[o['id'] for o in objects['objects']]
          assert len(ids)==832 and len(set(ids))==832
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          entries={}
          for stem in stems:
              raw=root/(stem+'.verts')
              meta=root/(stem+'.json')
              info=json.loads(meta.read_text())
              assert raw.stat().st_size==sum(int(s['count']) for s in info['meshes'])*20
              entries[stem]={'verts':sha(raw),'meta':sha(meta)}
          asset_paths=['assets/terrain25d/atlas_00.png',
                       'assets/terrain25d/atlas_01.png',
                       'assets/terrain25d/manifest.json']
          integrity={'source_run_id':41234831527,'index_sha256':sha(root/'index.json'),
                     'objects_sha256':sha(root/'r2_objects.json'),
                     'chunks':entries,'assets':{name:sha(name) for name in asset_paths}}
          (root/'source_integrity.json').write_text(json.dumps(integrity,sort_keys=True,separators=(',',':')))
          assert len(json.loads((root/'source_integrity.json').read_text())['chunks'])==156
          print('TAMU_SOURCE_INTEGRITY_OK chunks=156 objects=832 origin_run=41234831527')
          PY
      - name: Bake original terrain into one complete authored world
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('chunks')
          idx=json.loads((root/'index.json').read_text())
          integrity=json.loads((root/'source_integrity.json').read_text())
          assert len(idx['available'])==156 and integrity['source_run_id']==41234831527
          layers={0:bytearray(),1:bytearray()}
          total=0
          for stem in idx['available']:
              meta=json.loads((root/(stem+'.json')).read_text())
              raw=(root/(stem+'.verts')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==integrity['chunks'][stem]['verts']
              offset=0
              for surf in meta['meshes']:
                  count=int(surf['count'])
                  n=count*20
                  part=raw[offset:offset+n]
                  assert count%3==0 and len(part)==n
                  z=0 if str(surf['key']).startswith('!') else 1
                  layers[z].extend(part)
                  offset+=n
                  total+=count
              assert offset==len(raw),stem
          manifest={'schema':'tamu.region.terrain.v1','region_id':'fisilti_ormani',
                    'source_run_id':41234831527,'source_chunks':156,'vertices':total,'layers':[]}
          for z in (0,1):
              blob=bytes(layers[z])
              assert len(blob)>0 and len(blob)%60==0
              (root/('merged_layer_%d.verts'%z)).write_bytes(blob)
              manifest['layers'].append({'z':z,'file':'merged_layer_%d.verts'%z,
                                         'count':len(blob)//20,'sha256':hashlib.sha256(blob).hexdigest()})
          (root/'merged_terrain.json').write_text(json.dumps(manifest,separators=(',',':')))
          assert sum(x['count'] for x in manifest['layers'])==total
          assert manifest['region_id']=='fisilti_ormani' and manifest['source_chunks']==156
          assert len({x['z'] for x in manifest['layers']})==2
          print('TAMU_REGION_CHUNK_CONTRACT_OK regions=1 source_cells=156')
          print('TAMU_MERGE_SOURCE_PARITY_OK original_chunks=156 layers=2 vertices=',total)
          PY
      - name: Validate shared canonical gameplay JSON source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('data/catalog')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['catalog_version']==1 and len(manifest['definitions'])==7 and len(manifest['recipes'])==2
          definitions={}
          for name in manifest['definitions']:
              assert name.startswith('definitions/') and '..' not in name
              doc=json.loads((root/name).read_text())
              assert doc['id'] not in definitions and doc['schema_version']==1
              definitions[doc['id']]=doc
          recipes={}
          for name in manifest['recipes']:
              assert name.startswith('recipes/') and '..' not in name
              doc=json.loads((root/name).read_text())
              assert doc['schema_version']==1 and doc['id'] not in recipes
              recipes[doc['id']]=doc
              for side in ('inputs','outputs'):
                  assert doc[side] and all(x['def_id'] in definitions and x['count']>0 for x in doc[side])
          assert definitions['core:oak_tree']['components']['core:harvestable']['duration_ticks']==90
          assert definitions['core:stone_rock']['components']['core:harvestable']['duration_ticks']==120
          assert recipes['core:planks_from_log']['duration_ticks']==30
          assert recipes['core:bench_from_planks']['duration_ticks']==60
          print('TAMU_CANONICAL_GAMEPLAY_SOURCE_OK definitions=7 recipes=2 same_json=true')
          PY
      - name: Reconstruct exact source art and generate RGBA/RGB quality tiers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil >/dev/null
          python3 - <<'PYTEX'
          import hashlib, io, pathlib, zipfile
          parts=sorted(pathlib.Path('game/love/assets/terrain25d').glob('terrain_originals.part[0-9][0-9]'))
          assert len(parts)==26, ('TAMU_SOURCE_PARTS_MISSING',len(parts))
          raw=b''.join(p.read_bytes() for p in parts)
          expected='9aff9f15b39661d733b807c7dd76ca0e16e37c340ab821e7d3ea77c6ae61101c'
          assert len(raw)==22500162 and hashlib.sha256(raw).hexdigest()==expected, 'TAMU_SOURCE_ZIP_SHA_MISMATCH'
          dest=pathlib.Path('/tmp/tamu-terrain-originals')
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None, 'TAMU_SOURCE_ZIP_CRC_FAIL'
              names=[n for n in z.namelist() if n.startswith('original_sheets/') and n.endswith('.png')]
              assert len(names)==15 and len({pathlib.Path(n).name for n in names})==15
              for name in names:
                  assert pathlib.PurePosixPath(name).parts[0]=='original_sheets'
                  assert len(pathlib.PurePosixPath(name).parts)==2
                  (dest/pathlib.Path(name).name).write_bytes(z.read(name))
          print('TAMU_TERRAIN_ORIGINALS_AUTHENTIC_OK sheets=15 sha256='+expected)
          PYTEX
          python3 scripts/build_tamu_texture_tiers.py --manifest assets/terrain25d/manifest.json --sources /tmp/tamu-terrain-originals --output /tmp/tamu-texture-quality --objects-atlas assets/terrain25d/atlas_objects_hires.png
          cp /tmp/tamu-texture-quality/atlas_00_terrain_384.png assets/terrain25d/atlas_00_hires.png
          cp /tmp/tamu-texture-quality/atlas_00_terrain_mix_384.png assets/terrain25d/atlas_00_mix_hires.png
          python3 - <<'PYTEX'
          import json,pathlib
          from PIL import Image
          root=pathlib.Path('/tmp/tamu-texture-quality')
          for tier in (128,256,384):
              info=json.loads((root/f'terrain_{tier}_report.json').read_text())
              assert info['terrain_tiles']==168 and not info['quantization']
              assert len({(x['atlas_col'],x['atlas_row']) for x in info['asset_mapping']})==168
              assert Image.open(root/f'atlas_00_terrain_{tier}.png').size==(int(tier*14*1.03125),int(tier*12*1.03125))
              assert Image.open(root/f'atlas_00_terrain_mix_{tier}.png').size==Image.open(root/f'atlas_00_terrain_{tier}.png').size
          obj=json.loads((root/'objects_quality_report.json').read_text())
          assert set(obj)=={'512','384','256'}
          print('TAMU_TERRAIN_RGB_TIER_GATE_OK materials=168 tiers=384,256,128 object_tiers=512,384,256')
          PYTEX
      - name: Native Godot scene and screenshot smoke (Xvfb)
        shell: bash
        env:
          TAMU_VISUAL_CI: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-pil >/dev/null
          timeout --kill-after=3s 120s godot --headless --path . --script res://scripts/bake_minimap_ci.gd 2>&1 | tee screenshots-minimap-bake.log
          grep -q TAMU_STATIC_MINIMAP_BAKED_OK screenshots-minimap-bake.log
          test -s assets/ui/minimap/terrain.png
          python3 scripts/bake_terrain_mix.py | tee screenshots-mix-bake.log
          python3 scripts/build_forest_gui.py | tee screenshots-forest-ui.log
          if test -f ui/selection/packs/TAMU_Selection_GUI_Parts.zip; then
            python3 - <<'PYSELECTION'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('ui/selection/packs/TAMU_Selection_GUI_Parts.zip')
          output = Path('assets/ui/selection/parts')
          names = ["panel","title_tree","subtitle_tree","resource_bar","button_primary","button_detail","button_mark","icon_wood","icon_axe","icon_info","icon_pin"]
          with ZipFile(archive) as pack:
              present = set(pack.namelist())
              assert all(f'{name}.png' in present for name in names), 'TAMU_SELECTION_PARTS_MISSING'
              output.mkdir(parents=True,exist_ok=True)
              for name in names:
                  raw=pack.read(f'{name}.png')
                  assert raw.startswith(b'\x89PNG\r\n\x1a\n'), f'TAMU_SELECTION_BAD_PNG {name}'
                  (output/f'{name}.png').write_bytes(raw)
          print('TAMU_SELECTION_GUI_TEXTURES_EXTRACTED',len(names))
          PYSELECTION
          fi

          # Extract the uploaded source ZIP to importable Godot texture resources.
          # Never trust ZIP paths; only these expected flat RGBA PNG names.
          python3 - <<'PYHUD'
          import zipfile
          from pathlib import Path
          source = Path('assets/ui/hud/packs/TAMU_HUD_Correct_Split.zip')
          target = Path('assets/ui/hud/parts')
