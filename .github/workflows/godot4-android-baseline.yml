name: Godot 4.6 Android APK baseline
on:
  push:
    branches:
      - experiment/godot4-android-apk-20261031
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.6 and exact Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
          godot --headless --version
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot" build
          keytool -genkeypair -keystore "$RUNNER_TEMP/tamu-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=TAMU Debug,O=OSMAN,C=TR"
          mkdir -p "$HOME/.local/share/godot/keystores"
          cp "$RUNNER_TEMP/tamu-debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.local/share/godot/keystores/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Recover exact TAMU binary terrain and texture atlas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tamu-canonical assets/terrain25d chunks
          gh run download 41234831527 --repo "${{ github.repository }}" --name tamu-authored-r2-binary-cache --dir /tmp/tamu-canonical
          python3 - <<'PY'
          import zipfile, zlib, pathlib, json
          root=pathlib.Path('/tmp/tamu-canonical')
          archive=next(root.rglob('tamu-authored-compiled.love'))
          z=zipfile.ZipFile(archive)
          out=pathlib.Path('assets/terrain25d')
          for name in ('atlas_00.png','atlas_01.png','manifest.json'):
              (out/name).write_bytes(z.read('assets/terrain25d/'+name))
          binaries=next(root.rglob('c_0_0.meta.json')).parent
          count=0
          for cx in range(-1,3):
              for cy in range(-1,3):
                  stem=f'c_{cx}_{cy}'
                  meta=json.loads((binaries/(stem+'.meta.json')).read_text())
                  raw=zlib.decompress((binaries/(stem+'.verts.z')).read_bytes())
                  assert len(raw)==20*sum(x['count'] for x in meta['meshes'])
                  pathlib.Path('chunks',stem+'.verts').write_bytes(raw)
                  pathlib.Path('chunks',stem+'.json').write_text(json.dumps(meta,separators=(',',':')))
                  count+=1
          assert count==16
          print('TAMU_EXACT_ASSET_GATE_OK chunks=16')
          PY
      - name: Native Godot scene and screenshot smoke (Xvfb)
        shell: bash
        env:
          TAMU_VISUAL_CI: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-pil >/dev/null
          godot --headless --editor --path . --import --quit
          mkdir -p screenshots
          timeout 90s xvfb-run -a -s '-screen 0 720x1100x24' godot --path . --rendering-method gl_compatibility --resolution 720x1100 --quit-after 180 | tee screenshots/run.log
          grep -q TAMU_VISUAL_CAPTURE_OK screenshots/run.log
          IMAGE="$HOME/.local/share/godot/app_userdata/oyun/tamu-godot-visual.png"
          test -s "$IMAGE"
          cp "$IMAGE" screenshots/terrain-parity.png
          python3 - <<'PY'
          from PIL import Image,ImageStat
          i=Image.open('screenshots/terrain-parity.png').convert('RGB')
          assert i.width>=360 and i.height>=640
          colors=i.getcolors(maxcolors=100000)
          assert colors is None or len(colors)>50, 'blank/flat screenshot'
          print('TAMU_GODOT_VISUAL_SMOKE_OK',i.size)
          PY
      - name: Import project and export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          cat "$HOME/.config/godot/editor_settings-4.6.tres"
          godot --headless --verbose --path . --export-debug Android build/TAMU_Godot_Baseline.apk
          test -s build/TAMU_Godot_Baseline.apk
          unzip -t build/TAMU_Godot_Baseline.apk | tail -1
          sha256sum build/TAMU_Godot_Baseline.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-android-baseline
          path: |
            build/TAMU_Godot_Baseline.apk
            screenshots/terrain-parity.png
            screenshots/run.log
          if-no-files-found: warn
