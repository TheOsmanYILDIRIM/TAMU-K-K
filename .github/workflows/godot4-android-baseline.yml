      - name: Export standalone PCK and verify isolated boot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          mkdir -p build
          godot --headless --path . --export-pack Android build/tamu-android-content.pck
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('build/tamu-android-content.pck')
          with p.open('rb') as f:
              header=f.read(40)
              assert header[:4]==b'GDPC', 'Invalid Godot pack magic'
              end=struct.unpack_from('<Q',header,32)[0]
              f.seek(end)
              count=struct.unpack('<I',f.read(4))[0]
              names=[]
              for _ in range(count):
                  size=struct.unpack('<I',f.read(4))[0]
                  name=f.read(size).rstrip(b'\\x00').decode('utf-8')
                  f.seek(16+16+4,1)
                  names.append(name.lower())
          banned=('plasma','screenshots/','game/love/','art-source/','docs/','object-studio/','world-builder/')
          bad=[s for s in names if any(x in s for x in banned) or s.endswith(('.apk','.love','.mp3'))]
          assert not bad, f'PCK_FORBIDDEN_FILES {bad[:15]}'
          # Legacy Rigby references must not be shipped after profile-only cutover.
          legacy=[n for n in names if 'assets/osman_rig/' in n or 'scripts/rigby_fk.' in n or 'scripts/rigby_skinned.' in n]
          assert not legacy, f'PCK_LEGACY_CHARACTER_LEAK {legacy[:12]}'
