          if-no-files-found: warn
      # One independent artifact per quality: users download ONLY their chosen PCK.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-mobile-pck
          path: build/tamu-android-content-mobile.pck
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-balanced-pck
          path: build/tamu-android-content-balanced.pck
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-full-pck
          path: build/tamu-android-content.pck
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-test-results
          path: |
            screenshots/
            chunks/r2_objects.json
            chunks/index.json
          if-no-files-found: warn
