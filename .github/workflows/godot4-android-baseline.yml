          print('TAMU_PCK_TIER_INPUTS_READY',expected)
          PYQUALITY
          for variant in balanced mobile; do
            if [ "$variant" = balanced ]; then terrain=256; obj=384; else terrain=128; obj=256; fi
            cp "/tmp/tamu-texture-quality/atlas_00_terrain_${terrain}.png" assets/terrain25d/atlas_00_hires.png
            cp "/tmp/tamu-texture-quality/atlas_00_terrain_mix_${terrain}.png" assets/terrain25d/atlas_00_mix_hires.png
            cp "/tmp/tamu-texture-quality/atlas_objects_${obj}.png" assets/terrain25d/atlas_objects_hires.png
            godot --headless --editor --path . --import --quit
            TAMU_TERRAIN_MODE=merged TAMU_VISUAL_CASE=center timeout --kill-after=3s 75s xvfb-run -a -s '-screen 0 720x1100x24' godot --path . --rendering-method gl_compatibility --resolution 720x1100 --quit-after 210 | tee "screenshots/quality-${variant}.log"
            grep -q TAMU_TERRAIN_HIRES_ACTIVE "screenshots/quality-${variant}.log"
            grep -q TAMU_OBJECT_HIRES_ACTIVE "screenshots/quality-${variant}.log"
            cp "$HOME/.local/share/godot/app_userdata/oyun/tamu-godot-visual.png" "screenshots/quality-${variant}.png"
            godot --headless --path . --export-pack Android "build/tamu-android-content-${variant}.pck"
            test -s "build/tamu-android-content-${variant}.pck"
          done
          python3 - <<'PYQUALITY'
          from pathlib import Path
          import json
          from PIL import Image, ImageChops, ImageStat
          base=Image.open('screenshots/center-merged.png').convert('RGB')
          records=[]
          for label,terrain,obj,filename in [('full',384,512,'build/tamu-android-content.pck'),('balanced',256,384,'build/tamu-android-content-balanced.pck'),('mobile',128,256,'build/tamu-android-content-mobile.pck')]:
              p=Path(filename)
              assert p.read_bytes()[:4]==b'GDPC'
              row={'quality':label,'terrain_px':terrain,'object_px':obj,'pck_bytes':p.stat().st_size,
                   'terrain_rgb8_bytes':Path(f'/tmp/tamu-texture-quality/atlas_00_terrain_{terrain}.png').stat().st_size,
                   'object_rgba8_bytes':Path(f'/tmp/tamu-texture-quality/atlas_objects_{obj}.png').stat().st_size}
              if label!='full':
                  im=Image.open(f'screenshots/quality-{label}.png').convert('RGB')
                  assert im.size==base.size
                  delta=ImageChops.difference(base,im)
                  row['full_vs_tier_mean_abs_rgb']=round(sum(ImageStat.Stat(delta).mean)/3.0,4)
              records.append(row)
              print('TAMU_QUALITY_PCK_COMPARE',row)
          assert records[0]['pck_bytes']>records[1]['pck_bytes']>records[2]['pck_bytes'], records
          Path('screenshots/texture-quality-comparison.json').write_text(json.dumps(records,indent=2))
          print('TAMU_TEXTURE_QUALITY_PCK_COMPARE_OK tiers=3')
          PYQUALITY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-texture-tier-pcks
          path: |
            build/tamu-android-content-balanced.pck
            build/tamu-android-content-mobile.pck
            screenshots/texture-quality-comparison.json
            screenshots/quality-balanced.png
            screenshots/quality-mobile.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-loader-pck
          path: build/tamu-android-content.pck
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-test-results
          path: |
            screenshots/
            chunks/r2_objects.json
            chunks/index.json
          if-no-files-found: warn
