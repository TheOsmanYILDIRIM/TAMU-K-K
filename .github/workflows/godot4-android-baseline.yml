          if [ "$profile_rc" -ne 0 ] || ! grep -q TAMU_PROFILE_VIEW_SCALE_OK screenshots/exported-pack-profile.log || ! grep -q TAMU_PROFILE_ONLY_VISIBLE_OK screenshots/exported-pack-profile.log || grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_PROFILE_.*FAILED' screenshots/exported-pack-profile.log; then
            echo "TAMU_EXPORTED_PROFILE_PACK_FAILED exit=$profile_rc"
            exit 1
          fi
          echo TAMU_EXPORTED_PROFILE_PACK_OK
          sha256sum build/tamu-android-content.pck
      - name: Benchmark balanced and mobile texture PCKs and visual quality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQUALITY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path('/tmp/tamu-texture-quality')
          expected=[('full',384,512),('balanced',256,384),('mobile',128,256)]
          for label,terrain,obj in expected:
              assert Image.open(root/f'atlas_00_terrain_{terrain}.png').size==(14*(terrain+terrain//32),12*(terrain+terrain//32))
              assert Image.open(root/f'atlas_objects_{obj}.png').size==(obj*8,obj*8)
          print('TAMU_PCK_TIER_INPUTS_READY',expected)
          PYQUALITY
          for variant in balanced mobile; do
            if [ "$variant" = balanced ]; then terrain=256; obj=384; else terrain=128; obj=256; fi
            cp "/tmp/tamu-texture-quality/atlas_00_terrain_${terrain}.png" assets/terrain25d/atlas_00_hires.png
            cp "/tmp/tamu-texture-quality/atlas_00_terrain_mix_${terrain}.png" assets/terrain25d/atlas_00_mix_hires.png
            cp "/tmp/tamu-texture-quality/atlas_objects_${obj}.png" assets/terrain25d/atlas_objects_hires.png
            godot --headless --editor --path . --import --quit
            TAMU_TERRAIN_MODE=merged TAMU_VISUAL_CASE=center timeout --kill-after=3s 75s xvfb-run -a -s '-screen 0 720x1100x24' godot --path . --rendering-method gl_compatibility --resolution 720x1100 --quit-after 210 | tee "screenshots/quality-${variant}.log"
            grep -q TAMU_TERRAIN_HIRES_ACTIVE "screenshots/quality-${variant}.log"
            grep -q TAMU_OBJECT_HIRES_ACTIVE "screenshots/quality-${variant}.log"
            cp "$HOME/.local/share/godot/app_userdata/oyun/tamu-godot-visual.png" "screenshots/quality-${variant}.png"
            godot --headless --path . --export-pack Android "build/tamu-android-content-${variant}.pck"
            test -s "build/tamu-android-content-${variant}.pck"
          done
          python3 - <<'PYQUALITY'
          from pathlib import Path
          import json
          from PIL import Image, ImageChops, ImageStat
          base=Image.open('screenshots/center-merged.png').convert('RGB')
          records=[]
          for label,terrain,obj,filename in [('full',384,512,'build/tamu-android-content.pck'),('balanced',256,384,'build/tamu-android-content-balanced.pck'),('mobile',128,256,'build/tamu-android-content-mobile.pck')]:
              p=Path(filename)
              assert p.read_bytes()[:4]==b'GDPC'
              row={'quality':label,'terrain_px':terrain,'object_px':obj,'pck_bytes':p.stat().st_size,
                   'terrain_rgb8_bytes':Path(f'/tmp/tamu-texture-quality/atlas_00_terrain_{terrain}.png').stat().st_size,
                   'object_rgba8_bytes':Path(f'/tmp/tamu-texture-quality/atlas_objects_{obj}.png').stat().st_size}
              if label!='full':
                  im=Image.open(f'screenshots/quality-{label}.png').convert('RGB')
                  assert im.size==base.size
                  delta=ImageChops.difference(base,im)
                  row['full_vs_tier_mean_abs_rgb']=round(sum(ImageStat.Stat(delta).mean)/3.0,4)
              records.append(row)
              print('TAMU_QUALITY_PCK_COMPARE',row)
          assert records[0]['pck_bytes']>records[1]['pck_bytes']>records[2]['pck_bytes'], records
          Path('screenshots/texture-quality-comparison.json').write_text(json.dumps(records,indent=2))
          print('TAMU_TEXTURE_QUALITY_PCK_COMPARE_OK tiers=3')
          PYQUALITY
      - name: Build source-only 128px terrain and object PCK, verify isolated boot
        shell: bash
        run: |
          set -euo pipefail
          # Keep original sources: remove only 3 optional HD atlas references
          # from the export allowlist, never rescale 6-part player/Yaprakkulak.
          cp export_presets.cfg /tmp/tamu-export-presets-128-original.cfg
          trap 'cp /tmp/tamu-export-presets-128-original.cfg export_presets.cfg' EXIT
          python3 - <<'PY128CFG'
          from pathlib import Path
          preset=Path('export_presets.cfg')
          content=preset.read_text()
          removed=[
              'res://assets/terrain25d/atlas_00_hires.png',
              'res://assets/terrain25d/atlas_00_mix_hires.png',
              'res://assets/terrain25d/atlas_objects_hires.png',
          ]
          for path in removed:
              entry=', "'+path+'"'
              assert content.count(entry)==1, ('TAMU_128_EXPORT_PRESET_MISSING',path)
              content=content.replace(entry,'')
          preset.write_text(content)
          print('TAMU_128_SOURCE_PRESET_OK excluded_optional_hd=3')
          PY128CFG
          godot --headless --path . --export-pack Android build/tamu-android-content-128.pck
          python3 - <<'PY128PCK'
          from pathlib import Path
          import struct
          p=Path('build/tamu-android-content-128.pck')
          mobile=Path('build/tamu-android-content-mobile.pck')
          with p.open('rb') as f:
              header=f.read(40)
              assert header[:4]==b'GDPC' and struct.unpack_from('<I',header,4)[0]==3
              offset=struct.unpack_from('<Q',header,32)[0]
              f.seek(offset)
              count=struct.unpack('<I',f.read(4))[0]
              names=[]
              for _ in range(count):
                  length=struct.unpack('<I',f.read(4))[0]
                  name=f.read(length).split(bytes([0]),1)[0].decode()
                  f.seek(36,1)
                  names.append(name.lower())
          lowres=[
              'atlas_00.png-', 'atlas_00_mix.png-', 'atlas_01.png-',
          ]
          for name in lowres:
              assert any(name in item and item.endswith('.ctex') for item in names), ('TAMU_128_MISSING_ORIGINAL_ATLAS',name)
          highres=[
              'atlas_00_hires.png-', 'atlas_00_mix_hires.png-', 'atlas_objects_hires.png-',
          ]
          for name in highres:
              assert not any(name in item and item.endswith('.ctex') for item in names), ('TAMU_128_HD_ATLAS_LEAK',name)
          required=['scripts/profile_rig.gdc','scripts/mob_world.gdc','scripts/main.gdc',
              'scripts/pixellight_world.gdc','chunks/r2_objects.json',
              'chunks/merged_layer_1.verts','assets/profile_character/motion.json']
          for name in required:
              assert any(name in item for item in names), ('TAMU_128_RUNTIME_MISSING',name)
          assert p.stat().st_size < mobile.stat().st_size, ('TAMU_128_NOT_SMALLER',p.stat().st_size,mobile.stat().st_size)
          print('TAMU_128_SOURCE_PACK_OK files=',count,'bytes=',p.stat().st_size,'original_tile_px=128')
          PY128PCK
          # Critical: run without access to source files, like Android Loader.
          absolute="$PWD/build/tamu-android-content-128.pck"
          mkdir -p /tmp/tamu-128-only
          (
              cd /tmp/tamu-128-only
              TAMU_MOBILE_PERF=1 TAMU_PRODUCTION_SMOKE=1 XDG_DATA_HOME=/tmp/tamu-128-only \
                timeout --kill-after=3s 50s godot --headless --main-pack "$absolute" --quit-after 90
          ) 2>&1 | tee screenshots/128-only-boot.log
          grep -q TAMU_STAGE6_PRODUCTION_SMOKE_OK screenshots/128-only-boot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_STAGE6_PRODUCTION_GATE_FAILED|TAMU_R2_AUTHORITY_UNAVAILABLE' screenshots/128-only-boot.log; then exit 1; fi
          (
              cd /tmp/tamu-128-only
              TAMU_MOBILE_PERF=1 TAMU_VISUAL_CI=1 TAMU_VISUAL_CASE=profile XDG_DATA_HOME=/tmp/tamu-128-only \
                timeout --kill-after=3s 75s xvfb-run -a -s '-screen 0 720x1100x24' \
                godot --rendering-method gl_compatibility --resolution 720x1100 --main-pack "$absolute" --quit-after 115
          ) 2>&1 | tee screenshots/128-only-profile.log
          grep -q 'TAMU_OBJECT_HIRES_ACTIVE active=false atlas=1056' screenshots/128-only-profile.log
          grep -q TAMU_PROFILE_ONLY_VISIBLE_OK screenshots/128-only-profile.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TAMU_PROFILE_.*FAILED' screenshots/128-only-profile.log; then exit 1; fi
          sha256sum build/tamu-android-content-128.pck
