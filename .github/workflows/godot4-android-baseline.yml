name: Godot 4.6 Android APK baseline
on:
  push:
    branches:
      - experiment/godot4-android-apk-20261031
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.6 and exact Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
          godot --headless --version
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot" build
          keytool -genkeypair -keystore "$RUNNER_TEMP/tamu-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=TAMU Debug,O=OSMAN,C=TR"
          mkdir -p "$HOME/.local/share/godot/keystores"
          cp "$RUNNER_TEMP/tamu-debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.local/share/godot/keystores/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Recover exact TAMU binary terrain and texture atlas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tamu-canonical assets/terrain25d chunks
          gh run download 41234831527 --repo "${{ github.repository }}" --name tamu-authored-r2-binary-cache --dir /tmp/tamu-canonical
          python3 - <<'PY'
          import zipfile, zlib, pathlib, json
          root=pathlib.Path('/tmp/tamu-canonical')
          archive=next(root.rglob('tamu-authored-compiled.love'))
          z=zipfile.ZipFile(archive)
          out=pathlib.Path('assets/terrain25d')
          for name in ('atlas_00.png','atlas_01.png','manifest.json'):
              (out/name).write_bytes(z.read('assets/terrain25d/'+name))
          rig=pathlib.Path('assets/osman_rig/images')
          rig.mkdir(parents=True,exist_ok=True)
          for name in ('front_leg_L.png','front_leg_R.png','front_torso.png',
                       'front_arm_L.png','front_arm_R.png','front_head.png',
                       'back_leg_L.png','back_leg_R.png','back_torso.png',
                       'back_arm_L.png','back_arm_R.png','back_head.png'):
              (rig/name).write_bytes(z.read('assets/osman_rig/images/'+name))
          for entry in z.namelist():
              if entry.startswith('assets/osman_rig/images/') and entry.endswith('.png'):
                  (rig/pathlib.Path(entry).name).write_bytes(z.read(entry))
          for name in ('rig.json','directions.json','display.json'):
              (rig.parent/name).write_bytes(z.read('assets/osman_rig/'+name))
          rig_doc=json.loads((rig.parent/'rig.json').read_text())
          directions=json.loads((rig.parent/'directions.json').read_text())['directions']
          clips={c['name']:c for c in rig_doc.get('animations',[])}
          assert len(directions)==4 and len(clips)==44, (len(directions),len(clips))
          assert all(len(x['animations'])==11 for x in directions.values())
          assert all(clip in clips for d in directions.values() for clip in d['animations'].values())
          assert len(list(rig.glob('*.png')))==30
          print('TAMU_ORIGINAL_RIG_METADATA_OK png=30 directions=4 clips=44')
          shadows=pathlib.Path('assets/terrain25d/static_shadow')
          shadows.mkdir(parents=True,exist_ok=True)
          for n in ('objects_shadow_manifest.json','shadows_12.png'):
              (shadows/n).write_bytes(z.read('assets/terrain25d/static_shadow/'+n))
          binaries=next(root.rglob('c_0_0.meta.json')).parent
          count=0
          index=[]
          for meta_path in sorted(binaries.glob('c_*.meta.json')):
              stem=meta_path.name[:-10]
              meta=json.loads(meta_path.read_text())
              raw=zlib.decompress((binaries/(stem+'.verts.z')).read_bytes())
              assert len(raw)==20*sum(x['count'] for x in meta['meshes'])
              pathlib.Path('chunks',stem+'.verts').write_bytes(raw)
              pathlib.Path('chunks',stem+'.json').write_text(json.dumps(meta,separators=(',',':')))
              index.append(stem)
              count+=1
          assert count>=100, f'Expected authored cache >100 chunks, got {count}'
          world=json.loads(z.read('assets/worldbuild/osman_overworld.v2.json'))
          bounds=world['bounds']
          assert (bounds['max_x']-bounds['min_x'])//256==128
          assert (bounds['max_y']-bounds['min_y'])//256==128
          pathlib.Path('chunks/index.json').write_text(json.dumps({'available':index,'bounds':bounds},separators=(',',':')))
          print('TAMU_EXACT_ASSET_GATE_OK chunks=', count,'design_grid=128x128')
          PY
      - name: Export canonical R2 ecology objects using original Lua world logic
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 >/dev/null
          mkdir -p /tmp/tamu-love
          unzip -q "$(find /tmp/tamu-canonical -name tamu-authored-compiled.love -print -quit)" -d /tmp/tamu-love
          mkdir -p /tmp/tamu-love/chunks
          cp game/love/tests/export_godot_population.lua /tmp/tamu-love/tests/export_godot_population.lua
          (cd /tmp/tamu-love && lua5.4 tests/export_godot_population.lua)
          cp /tmp/tamu-love/chunks/r2_objects.json chunks/r2_objects.json
          python3 - <<'PY'
          import json
          data=json.load(open('chunks/r2_objects.json'))
          ids=[o['id'] for o in data['objects']]
          assert len(ids)==len(set(ids)) and len(ids)>100
          assert all(-1024<=o['x']<2304 and -1536<=o['y']<1536 for o in data['objects'])
          print('TAMU_R2_OBJECT_PARITY_OK',len(ids))
          PY
          (cd /tmp/tamu-love && lua5.4 - <<'LUA'
          local R=dofile('player/rigby_runtime.lua')
          local cases={
            {'linear',-1,'linear'}, {'stepped',-1,'stepped'},
            {'bezier',-1,{bezier={0.2,0.0,0.65,1.0}}},
            {'beziers',0,{beziers={{0.3,0.1,0.5,0.9},{0.7,0.4,0.9,0.6}}}},
            {'beziers',1,{beziers={{0.3,0.1,0.5,0.9},{0.7,0.4,0.9,0.6}}}}
          }
          local out=assert(io.open('chunks/rigby_curve_reference.txt','w'))
          for _,entry in ipairs(cases) do
            for _,time in ipairs({0,0.01,0.1,0.15,0.25,0.3,0.45,0.5,0.6,0.75,0.85,0.9,0.99,1.0}) do
              local comp=entry[2]>=0 and entry[2]+1 or nil
              local start=comp and {10,10} or 10
              local finish=comp and {30,30} or 30
              local keys={{time=0,value=start,curve=entry[3]},{time=1,value=finish}}
              local expected=R.sample(keys,time,comp)
              out:write(string.format('%s,%d,%.8f,%.12f\n',entry[1],entry[2],time,expected))
            end
          end
          out:close()
          print('TAMU_LUA_RIGBY_CURVE_REFERENCE_OK samples=70')
          LUA
          )
          cp /tmp/tamu-love/chunks/rigby_curve_reference.txt chunks/rigby_curve_reference.txt
      - name: Verify exact authored source and generate build-only hash manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('chunks')
          idx=json.loads((root/'index.json').read_text())
          objects=json.loads((root/'r2_objects.json').read_text())
          stems=idx['available']
          assert len(stems)==156 and len(set(stems))==156
          ids=[o['id'] for o in objects['objects']]
          assert len(ids)==832 and len(set(ids))==832
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          entries={}
          for stem in stems:
              raw=root/(stem+'.verts')
              meta=root/(stem+'.json')
              info=json.loads(meta.read_text())
              assert raw.stat().st_size==sum(int(s['count']) for s in info['meshes'])*20
              entries[stem]={'verts':sha(raw),'meta':sha(meta)}
          asset_paths=['assets/terrain25d/atlas_00.png',
                       'assets/terrain25d/atlas_01.png',
                       'assets/terrain25d/manifest.json',
                       'assets/osman_rig/rig.json']
          integrity={'source_run_id':41234831527,'index_sha256':sha(root/'index.json'),
                     'objects_sha256':sha(root/'r2_objects.json'),
                     'chunks':entries,'assets':{name:sha(name) for name in asset_paths}}
          (root/'source_integrity.json').write_text(json.dumps(integrity,sort_keys=True,separators=(',',':')))
          assert len(json.loads((root/'source_integrity.json').read_text())['chunks'])==156
          print('TAMU_SOURCE_INTEGRITY_OK chunks=156 objects=832 origin_run=41234831527')
          PY
      - name: Bake original terrain into one complete authored world
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('chunks')
          idx=json.loads((root/'index.json').read_text())
          integrity=json.loads((root/'source_integrity.json').read_text())
          assert len(idx['available'])==156 and integrity['source_run_id']==41234831527
          layers={0:bytearray(),1:bytearray()}
          total=0
          for stem in idx['available']:
              meta=json.loads((root/(stem+'.json')).read_text())
              raw=(root/(stem+'.verts')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==integrity['chunks'][stem]['verts']
              offset=0
              for surf in meta['meshes']:
                  count=int(surf['count'])
                  n=count*20
                  part=raw[offset:offset+n]
                  assert count%3==0 and len(part)==n
                  z=0 if str(surf['key']).startswith('!') else 1
                  layers[z].extend(part)
                  offset+=n
                  total+=count
              assert offset==len(raw),stem
          manifest={'schema':'tamu.region.terrain.v1','region_id':'fisilti_ormani',
                    'source_run_id':41234831527,'source_chunks':156,'vertices':total,'layers':[]}
          for z in (0,1):
              blob=bytes(layers[z])
              assert len(blob)>0 and len(blob)%60==0
              (root/('merged_layer_%d.verts'%z)).write_bytes(blob)
              manifest['layers'].append({'z':z,'file':'merged_layer_%d.verts'%z,
                                         'count':len(blob)//20,'sha256':hashlib.sha256(blob).hexdigest()})
          (root/'merged_terrain.json').write_text(json.dumps(manifest,separators=(',',':')))
          assert sum(x['count'] for x in manifest['layers'])==total
          assert manifest['region_id']=='fisilti_ormani' and manifest['source_chunks']==156
          assert len({x['z'] for x in manifest['layers']})==2
          print('TAMU_REGION_CHUNK_CONTRACT_OK regions=1 source_cells=156')
          print('TAMU_MERGE_SOURCE_PARITY_OK original_chunks=156 layers=2 vertices=',total)
          PY
      - name: Native Godot scene and screenshot smoke (Xvfb)
        shell: bash
        env:
          TAMU_VISUAL_CI: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-pil >/dev/null
          godot --headless --editor --path . --import --quit
          mkdir -p screenshots
          for case in center east west zoom north dawn reload; do
            for mode in legacy merged; do
              TAMU_TERRAIN_MODE="$mode" TAMU_VISUAL_CASE="$case" timeout 90s xvfb-run -a -s '-screen 0 720x1100x24' godot --path . --rendering-method gl_compatibility --resolution 720x1100 --quit-after 240 | tee "screenshots/$case-$mode.log"
              grep -q TAMU_VISUAL_CAPTURE_OK "screenshots/$case-$mode.log"
              grep -q TAMU_YDEPTH_SHADOW_ORDER_OK "screenshots/$case-$mode.log"
              grep -q TAMU_VIEWPORT_COVERAGE_OK "screenshots/$case-$mode.log"
              if [ "$case" = reload ] && [ "$mode" = merged ]; then
                grep -q 'TAMU_REGION_RELOAD_OK id_replaced=true region_count=1' "screenshots/$case-$mode.log"
                grep -q 'TAMU_REGION_UNLOAD_OK region=fisilti_ormani remaining=0' "screenshots/$case-$mode.log"
              fi
              if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid operands' "screenshots/$case-$mode.log"; then exit 1; fi
              cp "$HOME/.local/share/godot/app_userdata/oyun/tamu-godot-visual.png" "screenshots/$case-$mode.png"
            done
          done
          cp screenshots/center-merged.log screenshots/run.log
          cp screenshots/center-merged.png screenshots/terrain-parity.png
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          import json,pathlib
          result=[]
          for case in ('center','east','west','zoom','north','dawn','reload'):
              a=Image.open('screenshots/%s-legacy.png'%case).convert('RGB')
              b=Image.open('screenshots/%s-merged.png'%case).convert('RGB')
              assert a.size==b.size and a.size[0]>=720 and a.size[1]>=1100
              crop=(390,160,690,850)
              diff=ImageChops.difference(a.crop(crop),b.crop(crop))
              mean=sum(ImageStat.Stat(diff).mean)/3.0
              changed=sum(1 for px in diff.getdata() if max(px)>16)/float(diff.width*diff.height)
              row={'camera':case,'mean_abs_rgb':round(mean,4),'pixels_gt16_ratio':round(changed,5)}
              result.append(row)
              diff.save('screenshots/%s-world-diff.png'%case)
              print('TAMU_MERGED_VISUAL_DIFF',row)
              assert mean<=3.0 and changed<=0.06, 'MERGED_VISUAL_PARITY_FAILED '+str(row)
          pathlib.Path('screenshots/visual-comparison.json').write_text(json.dumps(result,indent=2))
          print('TAMU_MERGED_VISUAL_PARITY_OK scenarios=7')
          PY
          python3 - <<'PY'
          import json,re,pathlib,statistics
          records=[]
          for case in ('center','east','west','zoom','north','dawn','reload'):
              log=pathlib.Path('screenshots/%s-merged.log'%case).read_text()
              found=re.findall(r'TAMU_REGION_LOAD_OK region=fisilti_ormani source_cells=156 vertices=220254 native_nodes=2 prepare_ms=([0-9.]+) decode_ms=([0-9.]+) mesh_ms=([0-9.]+)',log)
              assert len(found)==(2 if case=='reload' else 1), (case,found)
              for i,values in enumerate(found):
                  p,d,m=map(float,values)
                  assert 0<=d<=p+1 and 0<=m<=p+1 and p<5000,(case,p,d,m)
                  records.append(dict(camera=case,phase='reload' if i else 'initial',
                                      prepare_ms=p,decode_ms=d,mesh_ms=m))
          init=sorted(x['prepare_ms'] for x in records if x['phase']=='initial')
          report=dict(records=records,median_ms=statistics.median(init),
                      maximum_ms=max(init),runner='GitHub ubuntu-24.04 Xvfb desktop',
                      unit='ms',gpu_latency_measured=False)
          pathlib.Path('screenshots/region-startup.json').write_text(json.dumps(report,indent=2))
          print('TAMU_REGION_STARTUP_PROFILE_OK scenarios=7 median_ms=',report['median_ms'],'max_ms=',report['maximum_ms'])
          PY
          grep -q TAMU_VISUAL_CAPTURE_OK screenshots/run.log
          grep -q TAMU_MERGED_TERRAIN_OK screenshots/run.log
          grep -q 'TAMU_REGION_LOAD_OK region=fisilti_ormani source_cells=156' screenshots/run.log
          grep -q TAMU_NATIVE_BONE_FK_READY screenshots/run.log
          grep -q TAMU_RIGBY_CURVE_PARITY_OK screenshots/run.log
          grep -q TAMU_WORLD_PROJECTION_GATE_OK screenshots/run.log
          grep -q TAMU_STREAM_SCHEDULER_OK screenshots/run.log
          grep -q TAMU_VIEWPORT_COVERAGE_OK screenshots/run.log
          grep -q TAMU_YDEPTH_SHADOW_ORDER_OK screenshots/run.log
          grep -q TAMU_RESIDENT_BUDGET_OK screenshots/run.log
          grep -q 'TAMU_WORLD_SOURCE_READY chunks=156' screenshots/run.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid operands' screenshots/run.log; then echo 'TAMU_RUNTIME_SCRIPT_GATE_FAILED'; exit 1; fi
          IMAGE="$HOME/.local/share/godot/app_userdata/oyun/tamu-godot-visual.png"
          test -s "$IMAGE"
          cp "$IMAGE" screenshots/terrain-parity.png
          python3 - <<'PY'
          from PIL import Image,ImageStat
          i=Image.open('screenshots/terrain-parity.png').convert('RGB')
          assert i.width>=360 and i.height>=640
          colors=i.getcolors(maxcolors=100000)
          assert colors is None or len(colors)>50, 'blank/flat screenshot'
          print('TAMU_GODOT_VISUAL_SMOKE_OK',i.size)
          PY
      - name: Import project and export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          cat "$HOME/.config/godot/editor_settings-4.6.tres"
          godot --headless --path . --export-pack Android build/tamu-android-content.pck
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/tamu-android-content.pck').read_bytes()
          for name in (b'chunks/index.json',b'chunks/r2_objects.json',b'chunks/source_integrity.json',b'chunks/merged_terrain.json',b'merged_layer_0.verts',b'merged_layer_1.verts',b'assets/osman_rig/rig.json'):
              assert name in p, f'ANDROID_ASSET_EXPORT_MISSING: {name!r}'
          print('TAMU_ANDROID_CONTENT_PACK_OK bytes=',len(p))
          PY
          godot --headless --verbose --path . --export-debug Android build/TAMU_Godot_Baseline.apk
          test -s build/TAMU_Godot_Baseline.apk
          unzip -t build/TAMU_Godot_Baseline.apk | tail -1
          sha256sum build/TAMU_Godot_Baseline.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamu-godot-android-baseline
          path: |
            build/TAMU_Godot_Baseline.apk
            screenshots/terrain-parity.png
            screenshots/run.log
            screenshots/*-legacy.png
            screenshots/*-merged.png
            screenshots/*-world-diff.png
            screenshots/visual-comparison.json
            screenshots/region-startup.json
            chunks/r2_objects.json
            chunks/index.json
          if-no-files-found: warn
