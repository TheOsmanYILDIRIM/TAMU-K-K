          assert all(any(key in s for s in names) for key in required), 'PCK_REQUIRED_ASSET_MISSING'
          runtime_scripts=('domain_catalog','domain_inventory','domain_harvesting',
              'domain_crafting','domain_building','gameplay_session','harvest_pathfinder',
              'stage6_checkpoint','stage6_domain_restore','r2_authority',
              'r2_surface','world_source','world_stream','merged_terrain',
              'world_identity','impact_effects','audio_cues','performance_hud','shadow_volume','visual_environment','forest_harvest_gui')
          missing_scripts=[name for name in runtime_scripts
              if not any(f'scripts/{name}.gd' in path for path in names)]
          assert not missing_scripts, f'PCK_RUNTIME_SCRIPTS_MISSING {missing_scripts}'
          assert any('scripts/object_shadow.gdshader' in path for path in names), 'PCK_SHADOW_SHADER_MISSING'
          assert any('scripts/harvest_outline.gdshader' in path for path in names), 'PCK_HARVEST_OUTLINE_SHADER_MISSING'
          assert any('scripts/pixellight_world.gd' in path for path in names), 'PCK_PIXELLIGHT_WORLD_MISSING'
          assert any('addons/pixel_light_2d/pixel_light.gd' in path for path in names), 'PCK_PIXELLIGHT_CORE_MISSING'
          assert any('scripts/forest_focus.gdshader' in path for path in names), 'PCK_FOREST_FOCUS_SHADER_MISSING'
          assert any('assets/gui/panel.png' in path for path in names), 'PCK_HARVEST_GUI_PANEL_MISSING'
          assert any('assets/gui/heading_tree.png' in path for path in names), 'PCK_HARVEST_GUI_HEADING_MISSING'
          assert any('assets/gui/joystick_base.png' in path for path in names), 'PCK_HARVEST_JOYSTICK_MISSING'
          assert any('scripts/modular_hud.gd' in path for path in names), 'PCK_MODULAR_HUD_SCRIPT_MISSING'
          assert any('assets/ui/minimap/terrain.png' in path for path in names), 'PCK_STATIC_MINIMAP_MISSING'
          assert any('scripts/minimap_static.gdshader' in path for path in names), 'PCK_MINIMAP_SHADER_MISSING'
          for required_profile in ['scripts/profile_rig.gdc','assets/profile_character/motion.json','assets/profile_character/01_bas.png','assets/profile_character/06_govde.png']:
              assert any(required_profile in path for path in names), f'PCK_PROFILE_RIG_MISSING {required_profile}'
          assert any('assets/ui/hud/layout.json' in path for path in names), 'PCK_MODULAR_HUD_LAYOUT_MISSING'
          for name in ('portrait','joystick','hotbar','interact','attack'):
              assert any(f'assets/ui/hud/parts/{name}.png' in path for path in names), f'PCK_HUD_TEXTURE_MISSING {name}'

          assert any('scripts/terrain_mix.gdshader' in path for path in names), 'PCK_TERRAIN_MIX_SHADER_MISSING'
          assert any('assets/terrain25d/atlas_00_mix.png' in path for path in names), 'PCK_BAKED_TERRAIN_MIX_MISSING'
          print('TAMU_EXPORTED_RUNTIME_SCRIPTS_OK',len(runtime_scripts))
          # Current Godot Yaprakkulak rig/AI and HD tier remaps total 641 pack entries.
          # Keep a bounded guard; the forbidden-source and required-asset gates above remain enforced.
          assert count < 680, f'PCK_TOO_MANY_FILES {count}'
          assert p.stat().st_size < 180*1024*1024, f'PCK_TOO_LARGE {p.stat().st_size}' # HD tier-specific PCK budget; original source assets excluded from exported pack
          print('TAMU_CLEAN_PCK_OK',p.stat().st_size,'files',count)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/tamu-android-content.pck').read_bytes()
          for name in (b'chunks/index.json',b'chunks/r2_objects.json',b'chunks/source_integrity.json',b'chunks/merged_terrain.json',b'merged_layer_0.verts',b'merged_layer_1.verts',b'assets/profile_character/motion.json',b'data/catalog/manifest.json',b'data/catalog/definitions/oak_tree.json',b'data/catalog/recipes/planks_from_log.json',b'data/catalog/compiled_catalog.res'):
              assert name in p, f'ANDROID_ASSET_EXPORT_MISSING: {name!r}'
          print('TAMU_ANDROID_CONTENT_PACK_OK bytes=',len(p))
          PY
          # Critical export-only regression: run the *pack*, not the source tree.
          # The Android grey screen can be caused by assets/scripts absent in
          # selected_resources even when editor/Xvfb source-project tests pass.
          mkdir -p /tmp/tamu-exported-pack-smoke
          pack_absolute="$PWD/build/tamu-android-content.pck"
          log_absolute="$PWD/screenshots/exported-pack-boot.log"
          # Launch outside the source repository: no res:// file fallback.
          pushd /tmp/tamu-exported-pack-smoke >/dev/null
          set +e
          XDG_DATA_HOME=/tmp/tamu-exported-pack-smoke TAMU_PRODUCTION_SMOKE=1 \
            timeout --kill-after=3s 45s godot --headless \
            --main-pack "$pack_absolute" --quit-after 90 \
            2>&1 | tee "$log_absolute"
          pack_rc=${PIPESTATUS[0]}
          popd >/dev/null
          set -e
          if [ "$pack_rc" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|TAMU_STAGE6_PRODUCTION_GATE_FAILED|TAMU_R2_AUTHORITY_UNAVAILABLE' screenshots/exported-pack-boot.log || ! grep -q TAMU_STAGE6_PRODUCTION_SMOKE_OK screenshots/exported-pack-boot.log; then
            echo "TAMU_EXPORTED_PACK_BOOT_FAILED exit=$pack_rc"
            exit 1
          fi
          echo TAMU_EXPORTED_PACK_BOOT_OK
          # Second isolated-pack smoke must reach the real code-driven player.
          # Early production smoke exits before _make_avatar and cannot catch
          # missing/incorrect profile assets in the exported Android PCK.
          set +e
          XDG_DATA_HOME=/tmp/tamu-exported-pack-profile TAMU_VISUAL_CI=1 TAMU_VISUAL_CASE=profile             timeout --kill-after=3s 60s godot --headless             --main-pack "$pack_absolute" --quit-after 80             2>&1 | tee screenshots/exported-pack-profile.log
          profile_rc=${PIPESTATUS[0]}
