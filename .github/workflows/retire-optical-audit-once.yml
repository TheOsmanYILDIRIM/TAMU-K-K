name: One-time retire archived optical plasma research branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-optical-audit-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  retire:
    if: github.repository == 'TheOsmanYILDIRIM/oyun'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='TheOsmanYILDIRIM',repo='oyun',ref='heads/experiment/core-plasma-optical-acceptance-20261017';
            if(context.repo.owner!==owner||context.repo.repo!==repo||context.ref!=='refs/heads/main')throw new Error('Wrong target');
            const expected='84db3a54e326db4ae36972fdec389aea5bcf30be';
            const preserved={"scripts/audit_optical_plasma_love.py":"e4f486e7395136cc13fb4e4428fab731af91d65c","scripts/drive_optical_generate_frames.py":"9f101471372cad46ed29375f5827d1676b83843c","scripts/tests/test_audit_optical_plasma_love.py":"5658e357f22282d6322bf01943e8e758b8827867","docs/25_OPTICAL_PLASMA_SOURCE_GATE.md":"8e1277153a1d4a26d376ab8d1eb24db780eb127a","docs/26_DRIVE_OPTICAL_PLASMA_BUILD_20261017.md":"cf109a4df082974ad31aa4b896dccca1cf1d324d"};
            for(const [path,sha] of Object.entries(preserved)){
             const file=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
             if(file.data.sha!==sha)throw new Error('Preserved source SHA changed: '+path);
            }
            const mainRun=await github.rest.actions.getWorkflowRun({owner,repo,run_id:39127173639});
            if(mainRun.data.head_sha!=='5e9a2bba58f18d3788886e755b631bffd5e419c0'||mainRun.data.conclusion!=='success')throw new Error('Main quality not accepted');
            const branchInfo=await github.rest.git.getRef({owner,repo,ref});
            if(branchInfo.data.object.sha!==expected)throw new Error('Optical experiment branch moved');
            await github.rest.git.deleteRef({owner,repo,ref});
            try{await github.rest.git.getRef({owner,repo,ref});throw new Error('Deleted branch still exists')}catch(err){if(err.status!==404)throw err}
            core.info('DELETED '+ref+' @ '+expected+'; preserved five source blobs on main; visual approval remains unverified');
