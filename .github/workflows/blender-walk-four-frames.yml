name: Adventurer CC0 Four-Direction Walk Frames
on:
  push:
    branches: [experiment/blender-camera-reference-20261011]
    paths:
      - '.github/workflows/blender-walk-four-frames.yml'
      - 'tools/blender_walk_four_frames.py'
      - 'assets/walk_source/adventurer.glb'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender python3-requests python3-numpy libegl1 libgl1 libgles2
      - name: Verify Blender Python dependencies
        run: blender -b --python-exit-code 2 --python-expr "import numpy; print('Blender numpy', numpy.__version__)"
      - name: Verify exact uploaded Adventurer GLB
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          source=pathlib.Path('assets/walk_source/adventurer.glb')
          if not source.is_file():
              raise RuntimeError('User-uploaded GLB missing from experiment branch')
          data=source.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          expected='4a8639cd8eee9d8a150464edc25eb0536ced464790704a64e40c8620d99f66db'
          if digest!=expected or len(data)!=1944116 or data[:4]!=b'glTF':
              raise RuntimeError('GLB does not match supplied file SHA256, byte count and header')
          (source.parent/'source.json').write_text(json.dumps({'page':'user-upload','license':'unverified','sha256':digest,'bytes':len(data)},indent=2))
          print('Verified original GLB:',digest)
          PY
      - name: Render 4 directions x 4 poses
        run: blender -b -t 2 --python-exit-code 2 --python tools/blender_walk_four_frames.py
      - name: Validate 16 directional PNGs and sample count
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          p=pathlib.Path('rendered/walk4')
          m=json.loads((p/'walk_manifest.json').read_text())
          assert m['camera_elevation']==45 and m['orthographic'] is True and m['source_page']=='user-upload'
          assert len(m['sample_frames'])==4 and len(m['pngs'])==16
          assert set(m['directions'])=={'front','back','left','right'}
          assert set(m['camera_azimuths'].values())=={45,135,225,315}
          assert all(len(info['frames'])==4 for info in m['directions'].values())
          assert len(set(m['pngs']))==16
          hashes=[]
          for name in m['pngs']:
              data=(p/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',data[16:24])==(512,768) and data[25]==6
              hashes.append(hashlib.sha256(data).hexdigest())
          assert len(set(hashes))==16
          print('PNG SHA256:',hashes)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adventurer-iso45-four-directions-16-walk-frames
          path: |
            rendered/walk4/
            assets/walk_source/source.json
          if-no-files-found: warn
