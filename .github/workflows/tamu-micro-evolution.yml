name: TAMU Micro Evolution - isolated video experiment
on:
  push:
    branches:
      - experiment/micro-evolution-actions-20261102
permissions:
  contents: read
jobs:
  micro-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run v0.3 cell specialization experiments and model invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          cat > "$RUNNER_TEMP/tamu_micro_source.b64" <<'B64'
          
          B64
          base64 -d "$RUNNER_TEMP/tamu_micro_source.b64" | gzip -dc > "$RUNNER_TEMP/tamu_micro_lab.py"
          echo "bdf368c846aa0af050f9c2756c856af6eecff9ba08dce296d3e8e7d41ee0c127  $RUNNER_TEMP/tamu_micro_lab.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/tamu_micro_lab.py"
          mkdir -p "$GITHUB_WORKSPACE/micro-output"
          TAMU_MICRO_OUTPUT="$GITHUB_WORKSPACE/micro-output" python3 "$RUNNER_TEMP/tamu_micro_lab.py"
          cp "$RUNNER_TEMP/tamu_micro_lab.py" "$GITHUB_WORKSPACE/micro-output/source.py"
          cd "$GITHUB_WORKSPACE/micro-output"
          sha256sum -c results.sha256
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of json tamu-micro-evolution.mp4
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          x=json.loads(Path('results.json').read_text())
          assert x['model']=='micro-colony-v0.3' and x['status']=='research_only_noncanonical'
          assert x['ticks']==600 and x['seeds']==[17,42,73] and len(x['results'])==3
          keys={'0-free','0-generalist','0-roles','1-free','1-generalist','1-roles'}
          for row in x['results']:
              assert set(row['trials'])==keys
              for p in ('0','1'):
                  assert row['trials'][p+'-free']['colonies']==0
                  assert row['trials'][p+'-generalist']['role_variance']==0
                  role=row['trials'][p+'-roles']
                  assert role['role_variance']>0
                  assert role['sensor_role_events']>0 and role['absorber_role_events']>0
              for v in row['trials'].values():
                  assert 0<=v['population']<=x['population_cap']
                  assert 1<=v['max_colony_seen']<=x['group_cap']
                  assert v['nutrient_assimilated']<=v['nutrient_consumed']
                  assert v['transfer_loss']>=0
          movie=Path('tamu-micro-evolution.mp4').read_bytes()
          assert b'ftyp' in movie[:12] and len(movie)>35000
          print('TAMU_V03_ARTIFACT_VERIFIED',len(movie))
          CHECK
      - name: Upload MP4 and reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: tamu-micro-evolution-v03
          path: |
            micro-output/tamu-micro-evolution.mp4
            micro-output/results.json
            micro-output/results.sha256
            micro-output/source.py
          if-no-files-found: error
          retention-days: 7
