name: TAMU Micro Evolution - third-party engine validation
on:
  push:
    branches:
      - experiment/micro-evolution-actions-20261102
permissions:
  contents: read
jobs:
  living-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fetch pinned upstream artificial life engine (no TAMU game code)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/skelinn/vivere.git "$RUNNER_TEMP/vivere"
          cd "$RUNNER_TEMP/vivere"
          git checkout --detach -q 9d76cbcc42e347ff3cb0cf34c19ecfe7cff11b27
          test "$(git rev-parse HEAD)" = "9d76cbcc42e347ff3cb0cf34c19ecfe7cff11b27"
          cp LICENSE "$RUNNER_TEMP/vivere-license.txt"
          echo 'TAMU_UPSTREAM_PIN_OK 9d76cbcc42e347ff3cb0cf34c19ecfe7cff11b27'
      - name: Test and compile real native Rust simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vivere"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 test --locked -p vivere-core
          cargo +1.97.1 build --locked --release -p vivere-cli -p vivere-gif
          echo "TAMU_UPSTREAM_ENGINE_BUILD_OK"
      - name: Reproduce evolutionary run and render MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe
          cd "$RUNNER_TEMP/vivere"
          mkdir -p "$GITHUB_WORKSPACE/engine-output"
          OUT="$GITHUB_WORKSPACE/engine-output"
          ./target/release/vivere run --seed 42 --ticks 6000 --metrics-every 300 --out "$OUT/seed42.csv" --save-snapshot "$OUT/seed42.snap"
          ./target/release/vivere run --seed 42 --ticks 6000 --metrics-every 300 --out "$RUNNER_TEMP/repeat.csv"
          cmp "$OUT/seed42.csv" "$RUNNER_TEMP/repeat.csv"
          ./target/release/vivere run --seed 73 --ticks 6000 --metrics-every 300 --out "$OUT/seed73.csv"
          ./target/release/vivere inspect "$OUT/seed42.snap" --summary > "$OUT/genome-census.txt"
          ./target/release/vivere-gif --seed 42 --ticks 4000 --every 20 --scale 0.5 --out "$OUT/organisms.gif"
          ffmpeg -y -loglevel error -i "$OUT/organisms.gif" -vf 'pad=ceil(iw/2)*2:ceil(ih/2)*2' -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$OUT/tamu-alife-engine.mp4"
          echo "9d76cbcc42e347ff3cb0cf34c19ecfe7cff11b27" > "$OUT/upstream-commit.txt"
          cp "$RUNNER_TEMP/vivere-license.txt" "$OUT/UPSTREAM-LICENSE.txt"
          python3 - <<'VERIFY'
          import csv, json, hashlib, os
          from pathlib import Path
          out=Path(os.environ["GITHUB_WORKSPACE"])/"engine-output"
          summary={}
          for seed in (42,73):
              with (out/f"seed{seed}.csv").open(newline="") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)>=5
              assert int(rows[0]["tick"])==0 and int(rows[-1]["tick"])==6000
              assert all(float(r["world_energy"]) >= 0 for r in rows)
              assert all(abs(float(r["drift"])) <= max(1.0, float(r["world_energy"]))*0.00001 for r in rows)
              summary[str(seed)]={"first_population":int(rows[0]["population"]), "last_population":int(rows[-1]["population"]), "last_mean_generation":float(rows[-1]["mean_generation"]), "max_relative_drift":max(abs(float(r["drift"]))/max(1.0,float(r["world_energy"])) for r in rows)}
          vid=out/"tamu-alife-engine.mp4"
          assert vid.stat().st_size>10000 and b"ftyp" in vid.read_bytes()[:12]
          assert (out/"genome-census.txt").stat().st_size>50
          summary.update({"status":"real_upstream_baseline_only", "magic_physics":"NOT_IMPLEMENTED", "source":"skelinn/vivere", "commit":"9d76cbcc42e347ff3cb0cf34c19ecfe7cff11b27", "same_seed_csv_identical":True,"video_bytes":vid.stat().st_size})
          (out/"validation.json").write_text(json.dumps(summary,indent=2)+"\n")
          for p in sorted(out.iterdir()):
              if p.is_file():
                  print("OUTPUT", p.name, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())
          print("TAMU_REAL_ENGINE_BASELINE_OK",json.dumps(summary))
          VERIFY
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height -of json "$OUT/tamu-alife-engine.mp4"
      - name: Publish reproducible baseline (NOT magic organ evolution)
        uses: actions/upload-artifact@v4
        with:
          name: tamu-real-alife-vivere-baseline
          path: engine-output/
          retention-days: 7
          if-no-files-found: error
