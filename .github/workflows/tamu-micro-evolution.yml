name: TAMU Micro Evolution - isolated video experiment
on:
  push:
    branches:
      - experiment/micro-evolution-actions-20261102
permissions:
  contents: read
jobs:
  micro-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run 2x2 cell-colony experiment and validate constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          cat > "$RUNNER_TEMP/tamu_micro_source.b64" <<'B64'
          
          B64
          base64 -d "$RUNNER_TEMP/tamu_micro_source.b64" | gzip -dc > "$RUNNER_TEMP/tamu_micro_lab.py"
          echo "74618fd53bd54beae926ec1fc4daae94f967bc521237432bf74a2fd7ffa42f92  $RUNNER_TEMP/tamu_micro_lab.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/tamu_micro_lab.py"
          mkdir -p "$GITHUB_WORKSPACE/micro-output"
          TAMU_MICRO_OUTPUT="$GITHUB_WORKSPACE/micro-output" python3 "$RUNNER_TEMP/tamu_micro_lab.py"
          cp "$RUNNER_TEMP/tamu_micro_lab.py" "$GITHUB_WORKSPACE/micro-output/source.py"
          cd "$GITHUB_WORKSPACE/micro-output"
          sha256sum -c results.sha256
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of json tamu-micro-evolution.mp4
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          d=json.loads(Path('results.json').read_text())
          assert d['model']=='micro-colony-v0.2' and d['status']=='research_only_noncanonical'
          assert d['seeds']==[17,42,73] and d['ticks']==900 and len(d['results'])==3
          expected={'00','01','10','11'}
          for row in d['results']:
              assert set(row['trials'])==expected
              assert row['trials']['00']['colonies']==0 and row['trials']['10']['colonies']==0
              assert row['trials']['01']['max_colony_seen']>1 and row['trials']['11']['max_colony_seen']>1
              for v in row['trials'].values():
                  assert 0<=v['population']<=d['population_cap']
                  assert 1<=v['max_colony_seen']<=d['group_cap']
                  assert v['nutrient_assimilated']<=v['nutrient_consumed']
                  assert v['transfer_loss']>=0
          raw=Path('tamu-micro-evolution.mp4').read_bytes()
          assert len(raw)>25000 and b'ftyp' in raw[:12]
          print('TAMU_COLONY_ARTIFACT_VERIFIED',len(raw))
          CHECK
      - name: Upload MP4 and reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: tamu-micro-evolution-preview
          path: |
            micro-output/tamu-micro-evolution.mp4
            micro-output/results.json
            micro-output/results.sha256
            micro-output/source.py
          if-no-files-found: error
          retention-days: 7
