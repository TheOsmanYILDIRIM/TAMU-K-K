name: Mixamo character four-view projection (SE Walking)
on:
  push:
    branches: [experiment/blender-camera-reference-20261011]
    paths:
      - 'assets/reference/character_fourview_proxy_320.webp'
      - 'tools/mixamo_fourview_prepare.py'
      - 'tools/mixamo_fourview_projection.py'
      - 'tools/mixamo_fourview_postcheck.py'
      - '.github/workflows/mixamo-fourview-projection.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil python3-numpy libegl1 libgl1
      - name: Validate pinned Mixamo Walking FBX and scripts
        run: |
          mkdir -p input
          git fetch origin 18fdb06e194a757b356de0668c7cd2246db80ece
          git show 18fdb06e194a757b356de0668c7cd2246db80ece:Walking.fbx > input/Walking.fbx
          test "$(stat -c %s input/Walking.fbx)" = 1839568
          /usr/bin/python3 -m py_compile tools/mixamo_fourview_prepare.py tools/mixamo_fourview_projection.py tools/mixamo_fourview_postcheck.py
      - name: Separate four uploaded views and extend opaque reference pixels
        run: /usr/bin/python3 tools/mixamo_fourview_prepare.py
      - name: Apply projected UVs to the skinned Mixamo mannequin and render SE Walking
        run: blender -b -t 2 --python-exit-code 2 --python tools/mixamo_fourview_projection.py
      - name: Validate frames and create visual comparison
        run: /usr/bin/python3 tools/mixamo_fourview_postcheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixamo-character-fourview-se-walking
          path: rendered/mixamo_fourview_projection/
          if-no-files-found: error
          retention-days: 10
