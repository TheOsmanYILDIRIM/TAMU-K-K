name: build-android
# APK derlemesi — CI'da (Termux'ta Gradle yok — ev kuralı 4)
# Sabit keystore: secrets.SIGNING_KEYSTORE (base64) + SIGNING_KEYSTORE_PASSWORD
# Aynı imza → eski sürüm silinmeden üst üste güncellenebilir (ev kuralı 4).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          curl -sL --retry 3 --fail -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android build template
        run: |
          godot --headless --path . --import
          # Export templates 4.4.1 (tpz içinde templates/ klasörü var)
          curl -sL --retry 3 --fail -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o -q templates.tpz -d ~/.local/share/godot/export_templates
          rm -rf ~/.local/share/godot/export_templates/4.4.1.stable
          mv ~/.local/share/godot/export_templates/templates \
             ~/.local/share/godot/export_templates/4.4.1.stable
          ls ~/.local/share/godot/export_templates/4.4.1.stable | head -3

      - name: Restore signing keystore (sabit imza)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          mkdir -p android
          if [ -z "$KS" ]; then
            echo "::warning::SIGNING_KEYSTORE secret yok — debug keystore ile devam ediliyor"
            keytool -genkeypair -v -keystore android/antigravity.keystore \
              -storepass antigravity -keypass antigravity -alias antigravity \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=oyun, OU=dev, O=avenox, L=tr, S=tr, C=TR"
          else
            echo "$KS" | base64 -d > android/antigravity.keystore
          fi

      - name: Export debug APK
        env:
          # Godot preset değerlerinden ÖNCE bunları okur (ENV_ANDROID_KEYSTORE_*)
          # headless export'ta preset keystore okuması güvenilir değil — env zorunlu.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/antigravity.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: antigravity
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: antigravity
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/antigravity.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: antigravity
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: antigravity
        run: |
          ls -la android/antigravity.keystore
          godot --headless --path . --export-debug \
            "Android" build/oyun-debug.apk
          ls -la build/oyun-debug.apk

      - name: Verify APK signature fingerprint
        run: |
          FP=$(keytool -printcert -jarfile build/oyun-debug.apk 2>/dev/null | \
            grep SHA256: | head -1 || echo "fingerprint-yok")
          echo "APK SHA256 imza: $FP"

      - uses: actions/upload-artifact@v4
        with:
          name: oyun-debug-apk
          path: build/oyun-debug.apk
