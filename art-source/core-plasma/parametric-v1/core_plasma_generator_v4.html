for(let j=0;j<s.orbits;j++)for(let i=0;i<s.count;i++){const r=randoms[j][i],a=2*Math.PI*i/s.count+j*1.618;const travel=a+t*(.16+.04*Math.sin(j*1.7));const p=orbit(j,travel,t),p2=orbit(j,travel+.004,t),angle=Math.atan2(p2[1]-p[1],p2[0]-p[0]);const jitter=s.scaleJitter/100;const size=(s.minScale+(s.maxScale-s.minScale)*(jitter*r[0]+(1-jitter)*.5))*(1+.12*Math.sin(t*1.5+a*3+r[1]*6));const w=Math.max(1,size*560*s.stretch),h=Math.max(1,size*560);const alpha=Math.min(1,s.opacity/100*(.4+.6*s.flow/100)*(1+s.pulse/100*.35*Math.sin(a*5-t*s.speed/25+r[4]*6)));const sprite=which==="mix"?[assets.ring,assets.ribbon,assets.curl,assets.wisp][Math.floor(r[4]*4)]:assets[which];const c=p[2]>0?fctx:bctx;c.save();c.translate(p[0]+s.scatter*(r[2]-.5)*-Math.sin(angle),p[1]+s.scatter*(r[2]-.5)*Math.cos(angle));c.rotate(angle+s.rotation*Math.PI/180+(r[3]-.5)*2*s.angleJitter*Math.PI/180);c.globalAlpha=alpha;c.globalCompositeOperation="screen";c.drawImage(sprite,-w/2,-h/2,w,h);c.restore()}
ctx.fillStyle="#000";ctx.fillRect(0,0,560,560);if($("backOn").checked)ctx.drawImage(back,0,0);if($("coreOn").checked)ctx.drawImage(assets.core,170,170,220,220);if($("frontOn").checked)ctx.drawImage(front,0,0);if($("glowOn").checked){ctx.save();ctx.filter="blur(6px)";ctx.globalCompositeOperation="screen";ctx.globalAlpha=s.glow/400;if($("backOn").checked)ctx.drawImage(back,0,0);if($("frontOn").checked)ctx.drawImage(front,0,0);ctx.restore()}
$("stats").textContent=`${s.orbits} yörünge · ${(s.orbits*s.count).toLocaleString("tr-TR")} damga · ${which}`}
let lastPaint=0;function tick(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){t+=dt*s.speed/28;dirty=true}if(dirty && (now-lastPaint>=80 || !playing)){render();dirty=false;lastPaint=now}requestAnimationFrame(tick)}
function sync(){for(const [k,v] of Object.entries(s)){const el=$("s_"+k);if(el){el.value=v;$("o_"+k).textContent=v}}dirty=true}
function settings(){return {...s,brush:$("brush").value,coreOn:$("coreOn").checked,backOn:$("backOn").checked,frontOn:$("frontOn").checked,glowOn:$("glowOn").checked}}
function apply(v){for(const k of Object.keys(defaults)){if(Number.isFinite(+v[k])){const el=$("s_"+k);s[k]=Math.max(+el.min,Math.min(+el.max,+v[k]))}}sync();if(assets[v.brush])$("brush").value=v.brush;if(v.brush==="mix")$("brush").value="mix";for(const k of ["coreOn","backOn","frontOn","glowOn"])if(typeof v[k]==="boolean")$(k).checked=v[k];makeRandoms();dirty=true}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"⏸ Duraklat":"▶ Oynat"};
$("reset").onclick=()=>{apply(defaults);$("brush").value="ring";$("msg").textContent="Sıfırlandı"};
$("dense").onclick=()=>apply({...s,orbits:8,count:750,minScale:.025,maxScale:.055,angleJitter:145,scaleJitter:90,scatter:4,opacity:40,flow:85});
$("soft").onclick=()=>apply({...s,orbits:5,count:200,minScale:.03,maxScale:.07,angleJitter:55,scatter:12,opacity:25,flow:50});
$("png").onclick=()=>canvas.toBlob(b=>download(b,"core_plasma.png"),"image/png");
$("jsonSave").onclick=()=>download(new Blob([JSON.stringify(settings(),null,2)],{type:"application/json"}),"core_plasma_settings.json");
$("jsonLoad").onclick=()=>{try{apply(JSON.parse($("json").value));$("msg").textContent="Ayarlar uygulandı"}catch(e){$("msg").textContent="JSON geçersiz"}};
$("copy").onclick=async()=>{const str=JSON.stringify(settings(),null,2);$("json").value=str;try{await navigator.clipboard.writeText(str);$("msg").textContent="Ayarlar kopyalandı"}catch(e){$("json").focus();$("json").select();$("msg").textContent="Metin seçildi; manuel kopyala"}};
for(const id of ["brush","coreOn","backOn","frontOn","glowOn"])$(id).onchange=()=>dirty=true;
Promise.all(Object.entries(DATA).map(([key,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{assets[key]=im;resolve()};im.onerror=reject;im.src=src}))).then(()=>{makeRandoms();requestAnimationFrame(tick);$("msg").textContent="Gömülü görseller yüklendi"}).catch(()=>{$("msg").textContent="Görsel yükleme hatası"});
</script></body></html>
