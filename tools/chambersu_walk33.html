<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJD Walk33 Deney</title><style>body{background:#151a23;color:#e9eef5;font:15px system-ui;max-width:700px;margin:24px auto;padding:14px}img{width:min(100%,384px);display:block;margin:12px auto;background:#283040}input{width:100%}button{padding:10px 15px;background:#536bb5;color:white;border:0;border-radius:8px}small{color:#abb5c8}</style><h2>ChamberSu BJD / 33 kare</h2><p>Deneysel rijit geometri döndürme. Anatomik pivotlar ve ayak teması henüz doğrulanmadı. Bu önizleme tamamlanmış oyun animasyonu değildir.</p><img id="frame" src="walk_00.png"><input type="range" min="0" max="32" value="0" id="seek"><button id="toggle">Oynat / durdur</button> <span id="count">Kare 0</span><p><small>Kaynak görüntüler Blender renderı; tarayıcıda otomatik iskelet interpolasyonu uygulanmıyor.</small></p><script>const im=document.getElementById('frame'),s=document.getElementById('seek');let play=false,last=0;function show(){im.src='walk_'+String(s.value).padStart(2,'0')+'.png';document.getElementById('count').textContent='Kare '+s.value}s.oninput=show;document.getElementById('toggle').onclick=()=>{play=!play;if(play)requestAnimationFrame(loop)};function loop(t){if(!play)return;if(t-last>100){s.value=(+s.value+1)%33;show();last=t}requestAnimationFrame(loop)}</script></html>
