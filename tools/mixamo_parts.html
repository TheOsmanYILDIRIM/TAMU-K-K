<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mixamo 32-frame</title><style>body{font:15px system-ui;background:#171b24;color:#eee;max-width:620px;margin:20px auto;padding:12px}img{width:min(100%,384px);display:block;margin:auto;background:#30343e}input{width:100%}button{padding:10px;border:0;border-radius:8px;background:#647cbd;color:white}</style><h2>Mixamo Walking — gerçek skin renderı</h2><p>32 orijinal animasyon karesi. Parça atlası nötr poz referansıdır; ayrı PNG rig oynatımı değildir.</p><img id="im" src="full_00.png"><input id="seek" type="range" min="0" max="31" value="0"><button id="play">Oynat / durdur</button> <span id="n">0</span><script>let on=false,last=0;const s=document.querySelector('#seek');function show(){document.querySelector('#im').src='full_'+String(s.value).padStart(2,'0')+'.png';document.querySelector('#n').textContent=s.value}s.oninput=show;document.querySelector('#play').onclick=()=>{on=!on;if(on)requestAnimationFrame(loop)};function loop(t){if(!on)return;if(t-last>100){s.value=(+s.value+1)%32;show();last=t}requestAnimationFrame(loop)}</script></html>
