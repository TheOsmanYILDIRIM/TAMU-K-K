<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJD Rig2D Audit</title><style>body{font:15px system-ui;background:#151922;color:#edf0f6;margin:0;padding:14px;max-width:760px}canvas{background:#272e3c;width:min(100%,512px);height:auto;border:1px solid #596476}input{width:100%}pre{white-space:pre-wrap;font-size:12px;color:#b8c3d4}button{padding:12px;background:#4164a5;color:white;border:0;border-radius:8px}</style><h2>BJD — gövde ve yürüyüş hedefleri</h2><p>Bu görüntü rig deformasyonu değil: sabit tek gövde PNG'si ve Adventurer'ın 33 karelik 3D kemik hedefleri. Hareket retarget doğrulanana dek animasyon sonucu sayılmaz.</p><p>Önce Actions artifact içindeki <code>rig2d_manifest.json</code> ve <code>isolated_body.png</code> dosyalarını seç.</p><input type="file" id="manifest" accept=".json"><input type="file" id="sprite" accept="image/png"><label>Kare <b id="frame">0</b><input type="range" id="seek" min="0" max="32" value="0"></label><button id="play">Oynat / durdur</button><div><canvas id="canvas" width="512" height="768"></canvas></div><pre id="details"></pre><script>let data=null,img=null,playing=false,tick=0;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),slider=document.getElementById('seek');function render(){ctx.clearRect(0,0,512,768);if(img)ctx.drawImage(img,0,0,512,768);if(!data)return;const a=data.motion_frames[+slider.value];document.getElementById('frame').textContent=a.frame;document.getElementById('details').textContent=JSON.stringify({variant:data.selected_variant,selected_mesh_count:data.selected_mesh_count,frame:a.frame,joints_3d:a.joints_3d,retarget_status:data.retarget_status},null,2)}document.getElementById('manifest').onchange=async e=>{data=JSON.parse(await e.target.files[0].text());if(data.motion_frames.length!==33)throw Error('33 frame required');render()};document.getElementById('sprite').onchange=e=>{const url=URL.createObjectURL(e.target.files[0]);const i=new Image();i.onload=()=>{img=i;URL.revokeObjectURL(url);render()};i.src=url};slider.oninput=render;document.getElementById('play').onclick=()=>{playing=!playing;if(playing)requestAnimationFrame(step)};function step(t){if(!playing)return;if(t-tick>90){slider.value=(+slider.value+1)%33;tick=t;render()}requestAnimationFrame(step)}</script></html>
