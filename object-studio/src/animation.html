<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142219">
<title>OSMAN · Animation Studio</title>
<style>
:root{font:14px system-ui,-apple-system,sans-serif;color:#e9f0e8;background:#0d1510;--panel:#1b2a20;--line:#36503e;--pale:#cde8aa;--muted:#a5b9a8}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0d1510;color:#e9f0e8}
button,label,summary{touch-action:manipulation}
button,input{font:inherit}button{border:1px solid var(--line);background:#26392d;color:inherit;border-radius:11px;padding:11px 12px;cursor:pointer;font-weight:650}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pale);outline-offset:2px}
button.primary{background:var(--pale);color:#17271b;border-color:var(--pale)}
header{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#18271c;border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right));position:relative}
header h1{margin:0;font-size:17px}header .sub{font-size:11px;color:var(--muted)}
.header-actions{display:flex;align-items:center;gap:6px}#buildBadge{font-size:10px;color:var(--muted)}#refresh{padding:7px 11px}
main{max-width:760px;margin:auto;padding:10px 10px calc(20px + env(safe-area-inset-bottom))}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:12px;margin-bottom:10px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
#frameMeta{font-weight:750;font-size:15px}#frameState{font-size:11px;color:var(--pale)}
.directionbar,.modes,.playbar,.actiongrid,.footbar{display:flex;gap:7px;align-items:center}
.directionbar{overflow-x:auto;padding-bottom:7px}.directionbar button{flex:1;white-space:nowrap;padding:8px 11px}
.modes{margin:8px 0}.modes button{flex:1;min-width:0;font-size:12px;padding:10px 4px}
button.active{background:var(--pale);color:#142318}
.stagewrap{width:100%;aspect-ratio:1;max-width:560px;margin:0 auto;border:1px solid #405345;background:#0a100c;border-radius:13px;overflow:hidden;position:relative}
#stage{width:100%;height:100%;display:block}
#compareLabels{pointer-events:none;display:none;position:absolute;top:0;left:0;right:0;padding:8px;justify-content:space-around;font-size:12px;font-weight:750;text-shadow:0 1px 3px #000}
#compareLabels.visible{display:flex}
.playbar{justify-content:center;margin:9px 0}.playbar button{min-width:54px}
.playbar #play{flex:1;max-width:190px}#speed{max-width:105px;flex:1;accent-color:#cde8aa}
#speedText{min-width:41px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
#strip{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;padding:5px 1px}
.framechip{flex:0 0 75px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;padding:5px;background:#1b2b20;border:1px solid #3c5744;text-align:center}
.framechip.active{outline:2px solid var(--pale);background:#274530}
.framechip canvas{width:100%;aspect-ratio:1;background:#0d150f;border-radius:7px}
.framechip span{font-size:10px;font-weight:700}
.framechip small{font-size:10px;color:var(--muted)}
h2{font-size:13px;letter-spacing:.03em;margin:0 0 9px}
.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actiongrid button,.actiongrid label{width:100%;text-align:center}
.filebutton{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#26392d;border-radius:11px;min-height:45px;font-weight:650;font-size:13px;cursor:pointer;padding:7px}
.filebutton input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
details{border:1px solid var(--line);background:#18261d;border-radius:12px;margin-top:9px}
summary{padding:12px;font-weight:750;cursor:pointer;list-style:none}summary:before{content:'▸  ';color:var(--pale)}details[open]>summary:before{content:'▾  '}
.detailbody{padding:2px 10px 12px;display:grid;gap:8px}
.full{width:100%}
#status{font-size:12px;color:var(--muted);min-height:20px;line-height:1.5;margin:6px 0}
#status.error{color:#ffbba1}
.mini{font-size:11px;color:var(--muted)}
kbd{font-family:inherit;color:var(--pale)}
@media(min-width:700px){main{padding-top:16px}.panel{padding:16px}.framechip{flex-basis:91px}.modes button{font-size:14px}}
</style>
</head>
<body>
<header>
  <div><h1>OSMAN · ANIMATION STUDIO</h1><div class="sub">Blender yürüyüşü · tek kare AI</div></div>
  <div class="header-actions"><span id="buildBadge">__ANIMATION_BUILD_SHA__</span><button id="refresh" type="button" aria-label="Yayını yenile">↻</button></div>
</header>
<main>
  <section class="panel" aria-label="Animasyon önizleme">
    <div class="topline"><div id="frameMeta">SE · Kare yok</div><div id="frameState">Kaynak bekleniyor</div></div>
    <div id="directions" class="directionbar" aria-label="Kamera yönü"></div>
    <div class="modes" role="group" aria-label="Önizleme">
      <button type="button" data-mode="original" class="active">Orijinal</button>
      <button type="button" data-mode="variant">AI Varyantı</button>
      <button type="button" data-mode="compare">Karşılaştır</button>
    </div>
    <div class="stagewrap"><canvas id="stage" width="720" height="720" aria-label="Tek animasyon önizleme"></canvas><div id="compareLabels"><span>ORİJİNAL</span><span>AI VARYANTI</span></div></div>
    <div class="playbar">
      <button type="button" id="prev" aria-label="Önceki kare">◀</button>
      <button type="button" id="play" class="primary">▶ Oynat</button>
      <button type="button" id="next" aria-label="Sonraki kare">▶</button>
      <input id="speed" type="range" min="1" max="24" value="12" aria-label="Oynatma hızı"><span id="speedText">12 FPS</span>
    </div>
    <div id="strip" role="group" aria-label="Yürüyüş kareleri"></div>
  </section>
  <section class="panel" aria-label="Seçili kare işlemleri">
    <h2>SEÇİLİ KARE</h2>
    <div class="actiongrid">
      <button type="button" id="exportOriginal">↓ Orijinal PNG</button>
      <button type="button" id="exportMask">↓ AI maskesi PNG</button>
      <label class="filebutton" for="variantInput">↑ AI varyantını yükle<input id="variantInput" type="file" accept="image/png"></label>
      <button type="button" id="exportVariant">↓ Varyant PNG</button>
    </div>
    <div class="footbar" style="margin-top:8px">
      <button type="button" id="copyPrompt" class="full">📋 Tek kare AI promptunu kopyala</button>
      <button type="button" id="removeVariant">Varyantı sil</button>
    </div>
  </section>
  <section class="panel" aria-label="Blender karelerini yükleme">
    <h2>YÜRÜYÜŞ KARELERİ</h2>
    <div class="actiongrid">
      <label class="filebutton primary" for="sourceInput">↑ ZIP veya PNG yükle<input id="sourceInput" type="file" accept=".zip,image/png" multiple></label>
      <button type="button" id="openBlender">↓ Blender 16 kare</button>
    </div>
    <details><summary>Toplu PNG indir</summary>
      <div class="detailbody">
        <button type="button" id="zipOriginal" class="full">↓ Tüm orijinal kareler ZIP</button>
        <button type="button" id="zipMasks" class="full">↓ Tüm otomatik AI maskeleri ZIP</button>
      </div>
    </details>
    <details><summary>Kayıtlar</summary><div class="detailbody">
      <button type="button" id="clearDirection" class="full">Seçili yönün kayıtlarını sil</button>
      <div class="mini">Diğer stüdyo kayıtlarına dokunulmaz.</div>
    </div></details>
  </section>
  <div id="status" role="status" aria-live="polite">Hazır.</div>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const DB='OsmanAnimationStudioFramesV1',STORE='frames',PREF='osman:animation-scene:clean:v1';
const DIRS=['SE','SW','NE','NW'],MAX_FILE=24*1024*1024,MAX_FRAMES=128,PREVIEW=720;
const sets={SE:[],SW:[],NE:[],NW:[]},cache=new Map();
const state={direction:'SE',selected:0,mode:'original',playing:false,fps:12,last:0,drawTicket:0,db:null,serial:0};
const ctx=$('stage').getContext('2d',{alpha:false});
const createCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function status(msg,bad=false){$('status').textContent=msg;$('status').classList.toggle('error',bad)}
function frameList(){return sets[state.direction]}
function activeFrame(){return frameList()[state.selected]||null}
function filename(path){return String(path).replace(/\\/g,'/').split('/').pop()}
function frameNumber(name){const m=filename(name).match(/(\d+)(?=\.png$)/i);return m?Number(m[1]):0}
function sortFiles(a,b){return frameNumber(a.name)-frameNumber(b.name)||a.name.localeCompare(b.name,'tr',{numeric:true})}
function directionOf(path){const name=String(path).replace(/\\/g,'/'),m=name.match(/(?:^|\/)(SE|SW|NE|NW)\//i)||filename(name).match(/^(SE|SW|NE|NW)[_-]/i);return m?m[1].toUpperCase():state.direction}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify({direction:state.direction,mode:state.mode,fps:state.fps}))}catch{}}
function readPrefs(){try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(DIRS.includes(p.direction))state.direction=p.direction;if(['original','variant','compare'].includes(p.mode))state.mode=p.mode;if(p.fps>=1&&p.fps<=24)state.fps=Number(p.fps)}catch{}}
function openDB(){return new Promise(resolve=>{if(!('indexedDB' in window)){resolve(null);return}try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'slot'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}})}
function readRecords(){return new Promise(resolve=>{if(!state.db){resolve([]);return}try{const r=state.db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])}catch{resolve([])}})}
function transaction(work){return new Promise((resolve,reject)=>{if(!state.db){resolve();return}try{const tx=state.db.transaction(STORE,'readwrite');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||Error('Kayıt hatası'));tx.onabort=()=>reject(tx.error||Error('Kayıt iptal'));work(tx.objectStore(STORE))}catch(e){reject(e)}})}
function record(d,i,frame){return {slot:d+':'+i,name:frame.name,source:frame.source,blob:frame.variant||frame.source,editedName:frame.variant?frame.editedName||'AI varyantı':null,x:0,y:0}}
function resetCache(){cache.clear();state.serial++}
async function restore(){
 const records=await readRecords();for(const r of records){
   const d=typeof r.slot==='number'?'SE':String(r.slot).split(':')[0];
   const i=typeof r.slot==='number'?r.slot:Number(String(r.slot).split(':')[1]);
   if(!DIRS.includes(d)||!Number.isSafeInteger(i)||i<0||i>=MAX_FRAMES||!(r.source instanceof Blob))continue;
   sets[d][i]={name:r.name||('frame_'+String(i+1).padStart(2,'0')+'.png'),source:r.source,variant:r.editedName&&r.blob instanceof Blob?r.blob:null,editedName:r.editedName||null};
 }
 for(const d of DIRS)sets[d]=sets[d].filter(Boolean);
 if(!frameList().length){const found=DIRS.find(d=>sets[d].length);if(found)state.direction=found}
 if(frameList().length)status('Yerel kareler geri yüklendi.');
 updateAll();
}
async function decode(blob){
 if(!(blob instanceof Blob)||blob.size>MAX_FILE)throw Error('PNG en fazla 24 MB olabilir');
 const image=await createImageBitmap(blob);try{
   if(image.width<16||image.height<16||image.width>8192||image.height>8192)throw Error('PNG ölçüsü desteklenmiyor');
   const c=createCanvas(image.width,image.height),g=c.getContext('2d',{willReadFrequently:true});g.drawImage(image,0,0);
   const out=g.getImageData(0,0,c.width,c.height),p=out.data,w=c.width,h=c.height;
   // A previously saved PNG may contain magenta guidance or an opaque black studio matte.
   // Cleanup acts on an in-memory copy; its original Blob is never changed.
   for(let k=0;k<p.length;k+=4)if(p[k]>217&&p[k+2]>201&&p[k+1]<85){p[k]=p[k+1]=p[k+2]=0;p[k+3]=0}
   const known=new Uint8Array(w*h),stack=[],dark=k=>{let n=k*4;return p[n+3]>248&&p[n]<18&&p[n+1]<18&&p[n+2]<18};
   // Pass across transparent former guide pixels so each old black grid cell
   // cannot remain an opaque rectangle. Only remove near-black pixels.
   const passable=k=>p[k*4+3]===0||dark(k);
   const add=k=>{if(!known[k]&&passable(k)){known[k]=1;stack.push(k)}};
   for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
   for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
   for(let n=0;n<stack.length;n++){const k=stack[n],x=k%w,y=(k/w)|0;if(x)add(k-1);if(x<w-1)add(k+1);if(y)add(k-w);if(y<h-1)add(k+w)}
   for(const k of stack)if(dark(k)){const n=k*4;p[n]=p[n+1]=p[n+2]=p[n+3]=0}
   g.putImageData(out,0,0);return c;
 }finally{image.close()}
}
function bbox(c){
 const {data}=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);let a=c.width,b=c.height,x=-1,y=-1;
 for(let j=0;j<c.height;j++)for(let i=0;i<c.width;i++)if(data[(j*c.width+i)*4+3]>18){a=Math.min(a,i);b=Math.min(b,j);x=Math.max(x,i);y=Math.max(y,j)}
 return x<0?null:{x:a,y:b,w:x-a+1,h:y-b+1};
}
async function raster(d,i,kind='original'){
 const f=sets[d][i];if(!f)throw Error('Kare bulunamadı');const blob=kind==='variant'?(f.variant||f.source):f.source;
 const key=d+':'+i+':'+kind+':'+state.serial;
 if(cache.has(key)){const v=cache.get(key);cache.delete(key);cache.set(key,v);return v}
 const c=await decode(blob),v={canvas:c,box:bbox(c)};
 cache.set(key,v);while(cache.size>5)cache.delete(cache.keys().next().value);
 return v;
}
function clearStage(){
 ctx.fillStyle='#0b110d';ctx.fillRect(0,0,PREVIEW,PREVIEW);ctx.textAlign='left';
}
function messageStage(message){
 ctx.fillStyle='#bed4bb';ctx.textAlign='center';ctx.font='19px system-ui';ctx.fillText(message,PREVIEW/2,PREVIEW/2);ctx.textAlign='left';
}
function drawPose(r,x,y,w,h){
 if(!r||!r.box)return;
 const b=r.box,scale=Math.min(w*.90/b.w,h*.88/b.h);
 const dw=b.w*scale,dh=b.h*scale,dx=x+(w-dw)/2,dy=y+h*.94-dh;
 ctx.drawImage(r.canvas,b.x,b.y,b.w,b.h,dx,dy,dw,dh);
}
async function render(){
 const ticket=++state.drawTicket,d=state.direction,i=state.selected,frame=activeFrame();
 clearStage();$('compareLabels').classList.toggle('visible',state.mode==='compare'&&!!frame);
 if(!frame){messageStage('Yürüyüş ZIP veya PNG yükle');return}
 try{
   const src=await raster(d,i),variant=state.mode==='original'?null:await raster(d,i,'variant');
   if(ticket!==state.drawTicket)return;
   clearStage();
   if(state.mode==='compare'){drawPose(src,0,0,PREVIEW/2,PREVIEW);ctx.fillStyle='#526754';ctx.fillRect(PREVIEW/2-1,0,2,PREVIEW);drawPose(variant,PREVIEW/2,0,PREVIEW/2,PREVIEW)}
   else drawPose(state.mode==='original'?src:(variant||src),0,0,PREVIEW,PREVIEW);
   if(!src.box)messageStage('Bu karede görünür alfa bulunamadı');
 }catch(e){if(ticket!==state.drawTicket)return;clearStage();messageStage('Görüntü çözülemedi');status(e.message,true)}
}
function controls(){
 const len=frameList().length,frame=activeFrame();
 $('frameMeta').textContent=len?state.direction+' · Kare '+String(state.selected+1).padStart(2,'0')+' / '+len:state.direction+' · Kare yok';
 $('frameState').textContent=frame?(frame.variant?'AI varyantı var':'Orijinal'):'Kaynak bekleniyor';
 $('play').textContent=state.playing?'⏸ Durdur':'▶ Oynat';
 $('speedText').textContent=state.fps+' FPS';$('speed').value=state.fps;
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
 for(const id of ['prev','next','play','exportOriginal','exportMask','copyPrompt','zipOriginal','zipMasks'])$(id).disabled=!len;
 for(const id of ['exportVariant','removeVariant'])$(id).disabled=!frame?.variant;
 $('variantInput').disabled=!len;
 const bar=$('directions');bar.replaceChildren();for(const d of DIRS){if(!sets[d].length)continue;
   const b=document.createElement('button');b.type='button';b.textContent=d+' · '+sets[d].length;b.classList.toggle('active',d===state.direction);
   b.onclick=()=>{state.direction=d;state.selected=0;state.playing=false;savePrefs();updateAll()};bar.append(b)}
}
function strip(){
 const list=frameList(),holder=$('strip');holder.replaceChildren();
 for(let i=0;i<list.length;i++){
   const f=list[i],b=document.createElement('button');b.type='button';b.className='framechip';b.classList.toggle('active',i===state.selected);
   const cv=createCanvas(92,92),title=document.createElement('span'),note=document.createElement('small');
   title.textContent=state.direction+' '+String(i+1).padStart(2,'0');note.textContent=f.variant?'AI ✓':'Orijinal';
   b.append(cv,title,note);b.onclick=()=>{state.selected=i;state.playing=false;updateAll()};holder.append(b);
   const d=state.direction;const serial=state.serial;
   raster(d,i,'original').then(r=>{if(serial!==state.serial||!cv.isConnected||!r.box)return;
     const g=cv.getContext('2d'),bb=r.box,k=Math.min(84/bb.w,84/bb.h);
     g.drawImage(r.canvas,bb.x,bb.y,bb.w,bb.h,(92-bb.w*k)/2,(92-bb.h*k)/2,bb.w*k,bb.h*k);
   }).catch(()=>{});
 }
}
function updateAll(){controls();strip();render()}
function step(n){const len=frameList().length;if(!len)return;
 state.selected=(state.selected+n+len)%len;
 controls();
 for(const [index,element] of [...$('strip').children].entries())element.classList.toggle('active',index===state.selected);
 render();
}
function tick(t){if(state.playing&&frameList().length&&t-state.last>=1000/state.fps){state.last=t;step(1)}requestAnimationFrame(tick)}
function png(canvas){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG oluşturulamadı')),'image/png'))}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function makeMask(d,i){
 const c=(await raster(d,i)).canvas,mask=createCanvas(c.width,c.height),mg=mask.getContext('2d',{willReadFrequently:true});
 const data=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height),out=mg.createImageData(c.width,c.height);
 for(let k=0;k<data.data.length;k+=4){out.data[k]=255;out.data[k+1]=255;out.data[k+2]=255;out.data[k+3]=255-data.data[k+3]}
 mg.putImageData(out,0,0);return mask;
}
async function constrainVariant(file,src){
 const ai=await decode(file);
 if(ai.width!==src.width||ai.height!==src.height)throw Error('AI kare boyutu farklı: '+src.width+'×'+src.height+' PNG yükle.');
 const c=createCanvas(src.width,src.height),g=c.getContext('2d',{willReadFrequently:true});g.drawImage(ai,0,0);
 const result=g.getImageData(0,0,c.width,c.height),old=src.getContext('2d',{willReadFrequently:true}).getImageData(0,0,src.width,src.height);
 for(let k=0;k<old.data.length;k+=4){
   const alpha=old.data[k+3];
   if(alpha<1){result.data[k]=result.data[k+1]=result.data[k+2]=result.data[k+3]=0;continue}
   if(result.data[k+3]<12){result.data[k]=old.data[k];result.data[k+1]=old.data[k+1];result.data[k+2]=old.data[k+2]}
   result.data[k+3]=alpha;
 }
 g.putImageData(result,0,0);return png(c);
}
const crcTable=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let k=i;for(let z=0;z<8;z++)k=(k>>>1)^((k&1)?0xedb88320:0);t[i]=k>>>0}return t})();
function crc32(data){let k=0xffffffff;for(const b of data)k=(k>>>8)^crcTable[(k^b)&255];return (k^0xffffffff)>>>0}
function makeZip(files){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0,centerLength=0;
 for(const f of files){
   const name=enc.encode(f.name),data=f.data,crc=crc32(data),h=new ArrayBuffer(30+name.length),v=new DataView(h);
   v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);new Uint8Array(h,30).set(name);
   parts.push(h,data);const c=new ArrayBuffer(46+name.length),z=new DataView(c);
   z.setUint32(0,0x02014b50,true);z.setUint16(4,20,true);z.setUint16(6,20,true);z.setUint32(16,crc,true);z.setUint32(20,data.length,true);z.setUint32(24,data.length,true);z.setUint16(28,name.length,true);z.setUint32(42,offset,true);new Uint8Array(c,46).set(name);central.push(c);offset+=h.byteLength+data.length;centerLength+=c.byteLength;
 }
 const end=new ArrayBuffer(22),v=new DataView(end);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,centerLength,true);v.setUint32(16,offset,true);
 return new Blob([...parts,...central,end],{type:'application/zip'});
}
async function unzip(file){
 if(file.size>180*1024*1024)throw Error('ZIP boyutu çok büyük');const buf=await file.arrayBuffer(),v=new DataView(buf),bytes=new Uint8Array(buf);
 const u16=i=>v.getUint16(i,true),u32=i=>v.getUint32(i,true),text=new TextDecoder();let end=-1;
 for(let p=buf.byteLength-22;p>=Math.max(0,buf.byteLength-65557);p--)if(u32(p)===0x06054b50){end=p;break}
 if(end<0)throw Error('ZIP dizini okunamadı');const n=u16(end+10);if(n>260)throw Error('ZIP çok fazla öğe içeriyor');
 let at=u32(end+16),out=[];
 for(let i=0;i<n;i++){
   if(at+46>buf.byteLength||u32(at)!==0x02014b50)throw Error('ZIP dizini bozuk');
   const method=u16(at+10),crc=u32(at+16),size=u32(at+20),expanded=u32(at+24),nameLen=u16(at+28),extra=u16(at+30),comment=u16(at+32),offset=u32(at+42);
   const name=text.decode(bytes.subarray(at+46,at+46+nameLen));at+=46+nameLen+extra+comment;
   if(!/\.png$/i.test(name)||/(\.\.|\\)/.test(name)||/mask|sheet|atlas|preview|grid/i.test(name))continue;
   if(size>MAX_FILE||expanded>MAX_FILE||![0,8].includes(method)||offset+30>buf.byteLength||u32(offset)!==0x04034b50)throw Error('ZIP PNG geçersiz: '+name);
   const first=offset+30+u16(offset+26)+u16(offset+28);if(first+size>buf.byteLength)throw Error('ZIP PNG sınırı bozuk');
   let data=bytes.slice(first,first+size);
   if(method===8){if(typeof DecompressionStream==='undefined')throw Error('ZIP sıkıştırması desteklenmiyor; Blender ZIP kullan');
     const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));data=new Uint8Array(await new Response(stream).arrayBuffer())}
   if(data.length!==expanded||crc32(data)!==crc)throw Error('ZIP doğrulaması başarısız: '+name);
   out.push(new File([data],name,{type:'image/png'}));
 }
 if(!out.length)throw Error('ZIP içinde numaralı PNG kare bulunamadı');return out;
}
async function oldDirectionKeys(){
 if(!state.db)return [];
 return new Promise(resolve=>{const r=state.db.transaction(STORE).objectStore(STORE).getAllKeys();
 r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])});
}
async function sourceFiles(files){
 const list=[];for(const f of files){if(/\.zip$/i.test(f.name))list.push(...await unzip(f));else if(/\.png$/i.test(f.name))list.push(f)}
 if(!list.length)throw Error('PNG veya ZIP seç');
 const groups={SE:[],SW:[],NE:[],NW:[]};for(const file of list)groups[directionOf(file.name)].push(file);
 const incoming={};for(const d of DIRS)if(groups[d].length){
   groups[d].sort(sortFiles);
   if(groups[d].length>MAX_FRAMES)throw Error('128 kare sınırı aşıldı');
   incoming[d]=[];
   for(const file of groups[d]){const bitmap=await createImageBitmap(file);const ok=bitmap.width>=16&&bitmap.height>=16&&bitmap.width<=8192&&bitmap.height<=8192;bitmap.close();if(!ok)throw Error('PNG ölçüsü geçersiz');
     incoming[d].push({name:filename(file.name),source:file,variant:null,editedName:null})}
 }
 const directions=Object.keys(incoming);
 if(directions.some(d=>sets[d].length)&&!confirm('Mevcut kaynak kareler bu yönlerde değiştirilecek: '+directions.join(', ')+'. AI varyantları da bu yönlerde sıfırlanacak. Devam?'))return;
 const storedKeys=await oldDirectionKeys();
 await transaction(store=>{for(const d of directions){
   // Replacing one direction explicitly clears its old numeric SE and named
   // keys, including sparse legacy records; unrelated directions are untouched.
   for(const key of storedKeys)if((d==='SE'&&typeof key==='number')||(typeof key==='string'&&key.startsWith(d+':')))store.delete(key);
   for(let i=0;i<incoming[d].length;i++)store.put(record(d,i,incoming[d][i]));
 }});
 for(const d of directions)sets[d]=incoming[d];
 state.direction=directions[0]||state.direction;state.selected=0;state.playing=false;resetCache();savePrefs();updateAll();
 status(directions.map(d=>d+': '+sets[d].length+' gerçek kare').join(' · ')+' yüklendi.');
}
async function action(fn){try{await fn()}catch(e){console.error(e);status(e.message||String(e),true)}}
$('sourceInput').onchange=e=>{const files=[...e.target.files||[]];e.target.value='';if(files.length)action(()=>sourceFiles(files))};
$('variantInput').onchange=e=>{const file=e.target.files?.[0];e.target.value='';if(!file||!activeFrame())return;
 action(async()=>{const d=state.direction,i=state.selected,fr=activeFrame(),src=(await raster(d,i)).canvas,blob=await constrainVariant(file,src);
   const changed={...fr,variant:blob,editedName:file.name};await transaction(store=>store.put(record(d,i,changed)));
   sets[d][i]=changed;resetCache();updateAll();status(d+' · '+String(i+1).padStart(2,'0')+' AI varyantı kaydedildi. Orijinal korunuyor.')})};
$('exportOriginal').onclick=()=>action(async()=>{const f=activeFrame();if(!f)return;download(await png((await raster(state.direction,state.selected)).canvas),state.direction+'_'+String(state.selected+1).padStart(2,'0')+'_ORIGINAL.png')});
$('exportMask').onclick=()=>action(async()=>{if(!activeFrame())return;download(await png(await makeMask(state.direction,state.selected)),state.direction+'_'+String(state.selected+1).padStart(2,'0')+'_AI_EDIT_MASK.png');status('AI maskesi indirildi: şeffaf karakter alanı düzenlenebilir.')});
$('exportVariant').onclick=()=>action(async()=>{const f=activeFrame();if(!f?.variant)return;download(await png((await raster(state.direction,state.selected,'variant')).canvas),state.direction+'_'+String(state.selected+1).padStart(2,'0')+'_VARIANT.png')});
$('removeVariant').onclick=()=>action(async()=>{const f=activeFrame();if(!f?.variant||!confirm('Yalnız seçili karenin AI varyantı silinsin mi? Orijinal korunur.'))return;const fresh={...f,variant:null,editedName:null};await transaction(store=>store.put(record(state.direction,state.selected,fresh)));sets[state.direction][state.selected]=fresh;resetCache();updateAll();status('AI varyantı kaldırıldı, orijinal korundu.')});
$('zipOriginal').onclick=()=>action(async()=>{const d=state.direction,files=[];for(let i=0;i<frameList().length;i++)files.push({name:d+'/frame_'+String(i+1).padStart(2,'0')+'.png',data:new Uint8Array(await (await png((await raster(d,i)).canvas)).arrayBuffer())});download(makeZip(files),d+'_all_original_frames.zip');status(files.length+' orijinal kare ZIP olarak indirildi.')});
$('zipMasks').onclick=()=>action(async()=>{const d=state.direction,files=[];for(let i=0;i<frameList().length;i++)files.push({name:d+'/frame_'+String(i+1).padStart(2,'0')+'_AI_EDIT_MASK.png',data:new Uint8Array(await (await png(await makeMask(d,i))).arrayBuffer())});download(makeZip(files),d+'_all_auto_masks.zip');status(files.length+' otomatik maske ZIP olarak indirildi.')});
$('prev').onclick=()=>{state.playing=false;step(-1)};$('next').onclick=()=>{state.playing=false;step(1)};
$('play').onclick=()=>{state.playing=!state.playing;state.last=performance.now();controls()};
$('speed').oninput=e=>{state.fps=Number(e.target.value);savePrefs();controls()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;savePrefs();controls();render()});
$('copyPrompt').onclick=()=>action(async()=>{
 const text='Image A is the definitive design reference for the game character. Image B is the exact original Blender walking frame and determines pose, fixed SE orthographic camera, canvas, scale, limb placement and silhouette. Change ONLY the character appearance inside the original silhouette. Keep the background genuinely transparent, do not add or change the scene or move the frame. Output exactly one RGBA PNG at Image B original pixel dimensions. Do not add grid, numbers, labels, glow or another character. If an API edit mask is provided, alpha=0 is editable character and alpha=255 is protected background. Preserve the original pose and character scale.';
 try{await navigator.clipboard.writeText(text);status('Tek kare AI promptu kopyalandı.')}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();status('Prompt kopyalandı.')}});
$('openBlender').onclick=()=>window.open('https://github.com/TheOsmanYILDIRIM/oyun/actions/runs/39279553854','_blank','noopener,noreferrer');
$('clearDirection').onclick=()=>action(async()=>{const d=state.direction;if(!sets[d].length||!confirm(d+' yönündeki tüm kareler ve AI varyantları kalıcı olarak silinsin mi?'))return;
 const storedKeys=await oldDirectionKeys();
 await transaction(store=>{for(const key of storedKeys)if((d==='SE'&&typeof key==='number')||(typeof key==='string'&&key.startsWith(d+':')))store.delete(key)});
 sets[d]=[];state.selected=0;state.playing=false;resetCache();updateAll();status('Yalnız '+d+' yönünün kayıtları silindi.')});
$('refresh').onclick=()=>{const u=new URL(location.href);u.searchParams.set('refresh',Date.now().toString());location.assign(u.href)};
async function bootstrap(){
 readPrefs();state.db=await openDB();await restore();requestAnimationFrame(tick);
 const sha='__ANIMATION_BUILD_SHA__';$('buildBadge').textContent=sha.slice(0,8);
 if(sha!=='local-dev')try{const r=await fetch('./build.json?version_check='+Date.now(),{cache:'no-store'});const j=await r.json();if(j.sha!==sha)status('Yeni sürüm yayında. Sağ üstte ↻ ile açabilirsin.')}catch{}
}
bootstrap().catch(e=>{console.error(e);status('Başlatma hatası: '+e.message,true);clearStage();messageStage('Yürüyüş karelerini yükle')});
})();
